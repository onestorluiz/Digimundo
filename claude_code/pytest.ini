[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output formatting
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    structure: tests for directory structure
    imports: tests for Python imports
    memory: tests for MEMORY/ and databases
    integration: integration tests
    slow: marks tests as slow

# Coverage (optional)
# addopts = --cov=systems --cov-report=term-missing

# Parallel execution (if pytest-xdist installed)
# addopts = -n auto
