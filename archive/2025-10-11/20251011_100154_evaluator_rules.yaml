    prompt: "Identify major strengths and standout elements in screenplay"
    books: ["making-a-good-script-great.txt", "Story-Robert-McKee"]

  weaknesses_identification:
    prompt: "Identify problems and areas needing improvement"
    books: ["making-a-good-script-great.txt", "Story-Robert-McKee"]

  critical_issues:
    prompt: "Detect critical issues and deal-breaker flaws"
    books: ["Story-Robert-McKee", "making-a-good-script-great.txt"]

  industry_readiness:
    prompt: "Assess readiness for professional market submission"
    books: ["Story-Robert-McKee", "screenplay.txt", "making-a-good-script-great.txt"]

  audience_appeal:
    prompt: "Evaluate audience engagement and appeal"
    books: ["save-the-cat.txt", "Story-Robert-McKee"]

  commercial_potential:
    prompt: "Assess commercial viability and marketability"
