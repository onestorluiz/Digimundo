  execution_quality:
    prompt: "Evaluate craft execution and technical mastery"
    books: ["Story-Robert-McKee", "on-film-making.txt"]

  originality:
    prompt: "Assess originality and fresh perspective"
    books: ["Story-Robert-McKee", "Anatomy-of-Story"]

  emotional_impact:
    prompt: "Evaluate emotional impact on audience"
    books: ["Story-Robert-McKee", "poetics_aristotle.txt"]

  thematic_depth:
    prompt: "Assess thematic significance and depth"
    books: ["Story-Robert-McKee", "Anatomy-of-Story"]

  story_cohesion:
    prompt: "Evaluate unity and integration of all elements"
    books: ["poetics_aristotle.txt", "Story-Robert-McKee"]

  professional_standard:
    prompt: "Assess against industry professional standards"
    books: ["Story-Robert-McKee", "screenplay.txt"]

  recommendations:
    prompt: "Generate prioritized recommendations for improvement"
    books: ["making-a-good-script-great.txt", "Story-Robert-McKee", "screenplay.txt"]

  final_verdict:
    prompt: "Provide final pass/fail determination and verdict"
    books: ["Story-Robert-McKee", "making-a-good-script-great.txt"]
