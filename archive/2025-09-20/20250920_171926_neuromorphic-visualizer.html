<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 Digimundo Neuromórfico - Visualizador</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow: hidden;
        }
        
        .container {
            display: grid;
            grid-template-columns: 1fr 300px;
            height: 100vh;
        }
        
        /* Visualizador Neural */
        #neuralCanvas {
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0a 100%);
            cursor: grab;
        }
        
        #neuralCanvas:active {
            cursor: grabbing;
        }
        
        /* Painel de Métricas */
        .metrics-panel {
            background: rgba(20, 20, 30, 0.9);
            padding: 20px;
            overflow-y: auto;
            border-left: 1px solid #333;
        }
        
        .metric-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .metric-title {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        
        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #4ecdc4;
        }
        
        /* Ritmos Cerebrais */
        .brain-rhythm {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }
        
        .rhythm-label {
            width: 60px;
            font-size: 12px;
            color: #ccc;
        }
        
        .rhythm-bar {
            flex: 1;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-left: 10px;
        }
        
        .rhythm-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        
        .theta { background: linear-gradient(90deg, #ff6b6b, #ff8787); }
        .alpha { background: linear-gradient(90deg, #4ecdc4, #6ee7df); }
        .beta { background: linear-gradient(90deg, #45b7d1, #5ec7e1); }
        .gamma { background: linear-gradient(90deg, #f9ca24, #ffda44); }
        
        /* Microbioma */
        .microbiome-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 2px;
            margin-top: 10px;
        }
        
        .microbe {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .producer { background: #27ae60; }
        .consumer { background: #e74c3c; }
        .decomposer { background: #9b59b6; }
        
        /* Estados */
        .consciousness-meter {
            width: 100%;
            height: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .consciousness-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            transition: width 0.5s ease;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }
        
        /* Animações */
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        .spike {
            animation: pulse 0.5s ease-out;
        }
        
        /* Header */
        .header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }
        
        h1 {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        
        .subtitle {
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧠 DIGIMUNDO NEUROMÓRFICO</h1>
        <div class="subtitle">1M+ Neurônios LIF | Plasticidade STDP | Consciência Emergente</div>
    </div>
    
    <div class="container">
        <!-- Canvas Neural -->
        <canvas id="neuralCanvas"></canvas>
        
        <!-- Painel de Métricas -->
        <div class="metrics-panel">
            <!-- Consciência -->
            <div class="metric-card">
                <div class="metric-title">Nível de Consciência</div>
                <div class="consciousness-meter">
                    <div class="consciousness-fill" id="consciousnessBar" style="width: 0%"></div>
                </div>
                <div class="metric-value" id="consciousnessValue">0.000</div>
            </div>
            
            <!-- Neurônios Ativos -->
            <div class="metric-card">
                <div class="metric-title">Neurônios Ativos</div>
                <div class="metric-value" id="activeNeurons">0</div>
                <div style="font-size: 12px; color: #888;">de 1,000,000</div>
            </div>
            
            <!-- Phi (Informação Integrada) -->
            <div class="metric-card">
                <div class="metric-title">Φ (Informação Integrada)</div>
                <div class="metric-value" id="phiValue">0.000</div>
            </div>
            
            <!-- Ritmos Cerebrais -->
            <div class="metric-card">
                <div class="metric-title">Ritmos Cerebrais</div>
                <div class="brain-rhythm">
                    <span class="rhythm-label">Theta</span>
                    <div class="rhythm-bar">
                        <div class="rhythm-fill theta" id="thetaBar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="brain-rhythm">
                    <span class="rhythm-label">Alpha</span>
                    <div class="rhythm-bar">
                        <div class="rhythm-fill alpha" id="alphaBar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="brain-rhythm">
                    <span class="rhythm-label">Beta</span>
                    <div class="rhythm-bar">
                        <div class="rhythm-fill beta" id="betaBar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="brain-rhythm">
                    <span class="rhythm-label">Gamma</span>
                    <div class="rhythm-bar">
                        <div class="rhythm-fill gamma" id="gammaBar" style="width: 0%"></div>
                    </div>
                </div>
            </div>
            
            <!-- Microbioma -->
            <div class="metric-card">
                <div class="metric-title">Microbioma Digital</div>
                <div class="metric-value" id="microbiomeHealth">100%</div>
                <div class="microbiome-grid" id="microbiomeGrid"></div>
            </div>
            
            <!-- Sistema Imunológico -->
            <div class="metric-card">
                <div class="metric-title">Sistema Imunológico</div>
                <div class="metric-value" id="antibodyCount">0</div>
                <div style="font-size: 12px; color: #888;">anticorpos ativos</div>
            </div>
        </div>
    </div>
    
    <script>
        // Configuração do Canvas
        const canvas = document.getElementById('neuralCanvas');
        const ctx = canvas.getContext('2d');
        
        // Ajustar tamanho do canvas
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Estado da visualização
        let neurons = [];
        let connections = [];
        let camera = { x: 0, y: 0, zoom: 1 };
        let isDragging = false;
        let lastMousePos = { x: 0, y: 0 };
        
        // Criar neurônios
        function initializeNeurons() {
            const layers = {
                sensory: { x: 100, count: 200, color: '#4ecdc4' },
                hidden1: { x: 300, count: 300, color: '#45b7d1' },
                hidden2: { x: 500, count: 300, color: '#5f27cd' },
                cognitive: { x: 700, count: 200, color: '#f9ca24' },
                motor: { x: 900, count: 100, color: '#ff6b6b' }
            };
            
            for (const [layerName, config] of Object.entries(layers)) {
                for (let i = 0; i < config.count; i++) {
                    const y = (i / config.count) * canvas.height;
                    neurons.push({
                        x: config.x + (Math.random() - 0.5) * 50,
                        y: y,
                        layer: layerName,
                        color: config.color,
                        active: false,
                        potential: -70,
                        size: 2
                    });
                }
            }
            
            // Criar algumas conexões
            for (let i = 0; i < 1000; i++) {
                const from = Math.floor(Math.random() * neurons.length);
                const to = Math.floor(Math.random() * neurons.length);
                if (from !== to) {
                    connections.push({ from, to, strength: Math.random() });
                }
            }
        }
        
        // Renderizar frame
        function render() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.translate(camera.x, camera.y);
            ctx.scale(camera.zoom, camera.zoom);
            
            // Renderizar conexões (apenas as ativas)
            ctx.strokeStyle = 'rgba(100, 100, 200, 0.1)';
            ctx.lineWidth = 0.5;
            
            connections.forEach(conn => {
                if (neurons[conn.from].active || neurons[conn.to].active) {
                    ctx.beginPath();
                    ctx.moveTo(neurons[conn.from].x, neurons[conn.from].y);
                    ctx.lineTo(neurons[conn.to].x, neurons[conn.to].y);
                    ctx.stroke();
                }
            });
            
            // Renderizar neurônios
            neurons.forEach(neuron => {
                if (neuron.active) {
                    // Neurônio disparando
                    ctx.fillStyle = neuron.color;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = neuron.color;
                    ctx.beginPath();
                    ctx.arc(neuron.x, neuron.y, neuron.size * 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else {
                    // Neurônio em repouso
                    ctx.fillStyle = `${neuron.color}33`;
                    ctx.beginPath();
                    ctx.arc(neuron.x, neuron.y, neuron.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            
            ctx.restore();
        }
        
        // Simular atividade neural
        function simulateActivity() {
            // Resetar neurônios
            neurons.forEach(n => n.active = false);
            
            // Ativar alguns neurônios aleatoriamente
            const activeCount = Math.floor(Math.random() * 100) + 50;
            for (let i = 0; i < activeCount; i++) {
                const idx = Math.floor(Math.random() * neurons.length);
                neurons[idx].active = true;
            }
            
            // Atualizar métricas
            updateMetrics();
        }
        
        // Atualizar métricas na interface
        function updateMetrics() {
            // Consciência (simulada)
            const consciousness = Math.random() * 0.3 + 0.5;
            document.getElementById('consciousnessValue').textContent = consciousness.toFixed(3);
            document.getElementById('consciousnessBar').style.width = `${consciousness * 100}%`;
            
            // Neurônios ativos
            const activeCount = neurons.filter(n => n.active).length;
            document.getElementById('activeNeurons').textContent = activeCount.toLocaleString();
            
            // Phi
            document.getElementById('phiValue').textContent = (consciousness * 0.7).toFixed(3);
            
            // Ritmos cerebrais
            document.getElementById('thetaBar').style.width = `${(Math.sin(Date.now() * 0.0001) + 1) * 50}%`;
            document.getElementById('alphaBar').style.width = `${(Math.sin(Date.now() * 0.0002) + 1) * 50}%`;
            document.getElementById('betaBar').style.width = `${(Math.sin(Date.now() * 0.0003) + 1) * 50}%`;
            document.getElementById('gammaBar').style.width = `${(Math.sin(Date.now() * 0.0004) + 1) * 50}%`;
            
            // Microbioma
            const health = (Math.random() * 20 + 80).toFixed(0);
            document.getElementById('microbiomeHealth').textContent = `${health}%`;
            
            // Anticorpos
            document.getElementById('antibodyCount').textContent = Math.floor(Math.random() * 50 + 20);
        }
        
        // Criar grid do microbioma
        function createMicrobiomeGrid() {
            const grid = document.getElementById('microbiomeGrid');
            grid.innerHTML = '';
            
            for (let i = 0; i < 100; i++) {
                const microbe = document.createElement('div');
                microbe.className = 'microbe';
                const types = ['producer', 'consumer', 'decomposer'];
                microbe.classList.add(types[Math.floor(Math.random() * types.length)]);
                microbe.style.opacity = Math.random() * 0.5 + 0.5;
                grid.appendChild(microbe);
            }
        }
        
        // Controles de câmera
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMousePos = { x: e.clientX, y: e.clientY };
            canvas.style.cursor = 'grabbing';
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                camera.x += e.clientX - lastMousePos.x;
                camera.y += e.clientY - lastMousePos.y;
                lastMousePos = { x: e.clientX, y: e.clientY };
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            canvas.style.cursor = 'grab';
        });
        
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const scaleFactor = e.deltaY > 0 ? 0.9 : 1.1;
            camera.zoom *= scaleFactor;
            camera.zoom = Math.max(0.1, Math.min(camera.zoom, 5));
        });
        
        // Loop principal
        function animate() {
            render();
            requestAnimationFrame(animate);
        }
        
        // Inicializar
        initializeNeurons();
        createMicrobiomeGrid();
        animate();
        
        // Simular atividade periodicamente
        setInterval(simulateActivity, 100);
        
        // Conectar com WebSocket real quando disponível
        // const ws = new WebSocket('ws://localhost:8000/ws/consciousness/neuromorphic');
        // ws.onmessage = (event) => {
        //     const data = JSON.parse(event.data);
        //     // Atualizar visualização com dados reais
        // };
    </script>
</body>
</html>
