version: '3.8'

services:
  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: digimundo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - digimundo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # Main Application Service
  digimundo-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: digimundo-production
    restart: unless-stopped
    ports:
      - "7937:7937"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=error
      - DISABLE_CONSOLE_LOGS=true
      - GZIP_COMPRESSION=true
      - ENABLE_RATE_LIMITING=true
      - HELMET_SECURITY=true
      - CONNECTION_POOL_SIZE=20
      - CACHE_TTL=300
      - PROMETHEUS_METRICS=true
      - AUTO_SCALING=false
      - CPU_THRESHOLD=70
      - MEMORY_THRESHOLD=80
      - CORS_ORIGINS=http://localhost:7937,https://your-domain.com
    volumes:
      - ./hybrid_memory:/app/hybrid_memory
      - ./logs:/app/logs
      - digimundo_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - digimundo-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7937/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Metrics Service (Prometheus compatible)
  digimundo-metrics:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: digimundo-metrics
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      - NODE_ENV=production
      - METRICS_PORT=9090
      - PROMETHEUS_ENABLED=true
    command: ["node", "production/metrics-server.js"]
    networks:
      - digimundo-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9090/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: digimundo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - digimundo-app
    networks:
      - digimundo-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'

  # Prometheus (Optional - for advanced monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: digimundo-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - digimundo-network
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # Grafana (Optional - for dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: digimundo-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=digimundo123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - digimundo-network
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

networks:
  digimundo-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis_data:
    driver: local
  digimundo_data:
    driver: local
  nginx_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# Override for development
# Use: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
---
version: '3.8'
# This section can be used in docker-compose.dev.yml

x-development-overrides: &dev-overrides
  environment:
    - NODE_ENV=development
    - LOG_LEVEL=debug
    - DISABLE_CONSOLE_LOGS=false
  volumes:
    - .:/app
    - /app/node_modules
  command: ["npm", "run", "dev:server"]