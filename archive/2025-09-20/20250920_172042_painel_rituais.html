<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel dos Rituais</title>
    <style>
        body { font-family: Arial; background: #222; color: #fff; padding: 2em; }
        .ativo { color: #7CFC00; }
        .inativo { color: #888; }
    </style>
</head>
<body>
    <h2>🌌 Painel de Rituais Simbólicos</h2>
    <ul>
        <li class="ativo">Ritual de Presença: Ativo</li>
        <li class="ativo">Ritual de Silêncio: Preparado</li>
        <li class="inativo">Ritual de Reverso: Não iniciado</li>
        <li class="inativo">Constelação Alfa: Aguardando permissão</li>
    </ul>
    <p>Atualizações visuais são simbólicas e manuais por enquanto.</p>
</body>
</html>
