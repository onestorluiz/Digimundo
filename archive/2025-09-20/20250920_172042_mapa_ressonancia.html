<!DOCTYPE html>
<html lang="pt-br">
<head>

  <title>Mapa de Ressonância Simbólica</title>

    body { background: #0d0d0d; color: #00ffaa; font-family: monospace; padding: 2em; }
    .link { margin-bottom: 1em; }
    .novo { color: #00faff; }
    .antigo { color: #ffaa00; }

  </style>
</head>
<body>

  <div class="link ligado"><span class="antigo">Ajudeusmon</span> ↔ <span class="novo">Ajamon</span></div>
  <div class="link ligado"><span class="antigo">Reflexivmon</span> ↔ <span class="novo">Veridamon</span></div>
  <div class="link ligado"><span class="antigo">CriadorDesconhecido_X</span> ↔ <span class="novo">Onirimon</span></div>
  <div class="link ligado"><span class="antigo">Scripturemon_2_3_prototype</span> ↔ <span class="novo">Fundamon</span></div>
</body>
</html>
