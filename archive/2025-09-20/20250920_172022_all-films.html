<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All Films – Midnight Pictures</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    body { background: #000; color: #eee; font-family: 'Oswald', sans-serif; margin: 0; }
    header { padding: 1rem 2rem; background: #000; border-bottom: 1px solid #222; }
    header h1 { margin: 0; color: #0cf; }
    main { padding: 2rem; }
    .film-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 2rem;
    }
    .film-card {
      background: #111;
      border-radius: 6px;
      overflow: hidden;
      transition: transform 0.3s ease;
      cursor: pointer;
    }
    .film-card:hover { transform: scale(1.02); }
    .film-card img {
      width: 100%;
      height: 330px;
      object-fit: cover;
    }
    .film-title {
      text-align: center;
      padding: 1rem 0;
      font-size: 1rem;
    }
    .film-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #0cf;
      color: #000;
      font-weight: bold;
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .film-poster { position: relative; }
  </style>
</head>
<body>
  <header>
    <h1>All Films – Midnight Pictures</h1>
  </header>
  <main>
    <div class="film-grid" id="all-films-grid"></div>
  </main>
  <script>
    const films = JSON.parse(localStorage.getItem("allFilmsData")) || [];

    const container = document.getElementById("all-films-grid");
    films.forEach(film => {
      const card = document.createElement("div");
      card.className = "film-card";
      card.innerHTML = `
        <div class="film-poster">
          <img src="../${film.image}" alt="${film.title}">
          <span class="film-badge">${film.category.toUpperCase()}</span>
        </div>
        <div class="film-title">${film.title}</div>
      `;
      card.onclick = () => window.location.href = "../films/" + film.title.toLowerCase().replace(/ /g, '-') + ".html";
      container.appendChild(card);
    });
  </script>
</body>
</html>
