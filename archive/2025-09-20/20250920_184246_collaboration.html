<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digimundo Collaboration Studio - MODO HACKER</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
        }

        .collaboration-container {
            display: grid;
            grid-template-columns: 300px 1fr 350px;
            grid-template-rows: 60px 1fr 200px;
            grid-template-areas: 
                "header header header"
                "sidebar workspace chat"
                "timeline timeline timeline";
            height: 100vh;
        }

        .header {
            grid-area: header;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .room-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .participants-count {
            background: #4CAF50;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
        }

        .sidebar {
            grid-area: sidebar;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            overflow-y: auto;
        }

        .participants-list {
            margin-bottom: 30px;
        }

        .participant {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin: 5px 0;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .participant:hover {
            background: rgba(103, 126, 234, 0.1);
        }

        .participant.active {
            background: rgba(103, 126, 234, 0.2);
        }

        .participant-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .workspace {
            grid-area: workspace;
            background: white;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
        }

        .storyboard-canvas {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .scene-card {
            position: absolute;
            width: 250px;
            height: 180px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid #ddd;
            padding: 15px;
            cursor: move;
            transition: all 0.3s ease;
        }

        .scene-card:hover {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        .scene-card.editing {
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(103, 126, 234, 0.3);
        }

        .scene-title {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .scene-description {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.4;
        }

        .cursor {
            position: absolute;
            pointer-events: none;
            z-index: 1000;
            transition: all 0.1s ease;
        }

        .cursor::after {
            content: attr(data-user);
            position: absolute;
            top: 20px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .chat-panel {
            grid-area: chat;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .chat-message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            background: #f5f5f5;
        }

        .chat-message.system {
            background: #e3f2fd;
            border-left: 3px solid #2196F3;
        }

        .chat-input {
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        .chat-input input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
        }

        .timeline {
            grid-area: timeline;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px;
            overflow-x: auto;
        }

        .timeline-container {
            display: flex;
            gap: 20px;
            min-width: 100%;
        }

        .timeline-event {
            min-width: 200px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }

        .video-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .video-button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .video-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .video-button.active {
            background: #4CAF50;
        }

        .floating-toolbar {
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tool-button {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .tool-button:hover {
            transform: scale(1.1);
        }

        .voice-indicator {
            position: fixed;
            top: 80px;
            right: 20px;
            background: rgba(76, 175, 80, 0.9);
            color: white;
            padding: 10px 15px;
            border-radius: 25px;
            display: none;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(76, 175, 80, 0.9);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }

        .screen-share-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .screen-share-video {
            max-width: 90%;
            max-height: 90%;
        }
    </style>
</head>
<body>
    <div class="collaboration-container">
        <header class="header">
            <h1>🎬 Digimundo Collaboration Studio</h1>
            <div class="room-info">
                <span id="room-name">Carregando...</span>
                <div class="participants-count">
                    <span id="participant-count">0</span> colaboradores
                </div>
                <div class="video-controls">
                    <button class="video-button" id="mic-btn" title="Microfone">🎤</button>
                    <button class="video-button" id="video-btn" title="Câmera">📹</button>
                    <button class="video-button" id="screen-btn" title="Compartilhar Tela">🖥️</button>
                </div>
            </div>
        </header>

        <aside class="sidebar">
            <div class="participants-list">
                <h3>👥 Colaboradores</h3>
                <div id="participants-container"></div>
            </div>
            
            <div class="tools-section">
                <h3>🛠️ Ferramentas</h3>
                <button class="tool-button" onclick="addScene()" title="Adicionar Cena">➕</button>
                <button class="tool-button" onclick="addCharacter()" title="Adicionar Personagem">👤</button>
                <button class="tool-button" onclick="addNote()" title="Adicionar Nota">📝</button>
            </div>
        </aside>

        <main class="workspace" id="workspace">
            <div class="storyboard-canvas" id="storyboard-canvas">
                <!-- Cenas do storyboard serão inseridas aqui dinamicamente -->
            </div>
        </main>

        <aside class="chat-panel">
            <div class="chat-header">💬 Chat Colaborativo</div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input">
                <input type="text" id="chat-input" placeholder="Digite sua mensagem ou /digimon comando...">
            </div>
        </aside>

        <footer class="timeline">
            <h3>⏱️ Timeline de Produção</h3>
            <div class="timeline-container" id="timeline-container">
                <!-- Eventos da timeline serão inseridos aqui -->
            </div>
        </footer>
    </div>

    <div class="floating-toolbar">
        <button class="tool-button" onclick="toggleFocusMode()" title="Modo Foco">🎯</button>
        <button class="tool-button" onclick="exportStoryboard()" title="Exportar">💾</button>
        <button class="tool-button" onclick="importAssets()" title="Importar">📁</button>
    </div>

    <div class="voice-indicator" id="voice-indicator">
        🎤 Falando...
    </div>

    <div class="notification" id="notification"></div>

    <div class="screen-share-overlay" id="screen-share-overlay">
        <video class="screen-share-video" id="screen-share-video" autoplay></video>
        <button onclick="closeScreenShare()" style="position: absolute; top: 20px; right: 20px; background: red; color: white; border: none; padding: 10px; border-radius: 5px;">Fechar</button>
    </div>

    <script>
        class DigimundoCollaborationClient {
            constructor() {
                this.socket = io();
                this.currentUser = null;
                this.currentRoom = null;
                this.cursors = new Map();
                this.localStream = null;
                this.peerConnections = new Map();
                this.isScreenSharing = false;
                
                this.setupSocketListeners();
                this.setupUIEventListeners();
                this.initializeUser();
            }

            setupSocketListeners() {
                this.socket.on('user-registered', (user) => {
                    this.currentUser = user;
                    this.joinRoom();
                });

                this.socket.on('room-joined', (data) => {
                    this.currentRoom = data.room;
                    this.updateUI();
                    this.showNotification(`Entrou na sala: ${data.room.name}`);
                });

                this.socket.on('user-joined', (user) => {
                    this.addParticipant(user);
                    this.showNotification(`${user.name} entrou na colaboração`);
                });

                this.socket.on('user-left', (user) => {
                    this.removeParticipant(user);
                    this.showNotification(`${user.name} saiu da colaboração`);
                });

                this.socket.on('cursor-update', (data) => {
                    this.updateCursor(data);
                });

                this.socket.on('storyboard-updated', (data) => {
                    this.handleStoryboardUpdate(data);
                });

                this.socket.on('timeline-updated', (data) => {
                    this.updateTimeline(data);
                });

                this.socket.on('chat-message', (message) => {
                    this.addChatMessage(message);
                });

                this.socket.on('screen-share-started', (data) => {
                    this.handleScreenShareStarted(data);
                });

                this.socket.on('screen-share-stopped', (data) => {
                    this.handleScreenShareStopped(data);
                });

                this.socket.on('webrtc-offer', (data) => {
                    this.handleWebRTCOffer(data);
                });

                this.socket.on('webrtc-answer', (data) => {
                    this.handleWebRTCAnswer(data);
                });

                this.socket.on('webrtc-ice-candidate', (data) => {
                    this.handleWebRTCIceCandidate(data);
                });
            }

            setupUIEventListeners() {
                // Chat input
                document.getElementById('chat-input').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.sendChatMessage();
                    }
                });

                // Mouse tracking para cursores
                document.getElementById('workspace').addEventListener('mousemove', (e) => {
                    const rect = e.currentTarget.getBoundingClientRect();
                    const cursor = {
                        x: e.clientX - rect.left,
                        y: e.clientY - rect.top
                    };
                    this.socket.emit('cursor-move', cursor);
                });

                // Video controls
                document.getElementById('mic-btn').addEventListener('click', () => this.toggleMicrophone());
                document.getElementById('video-btn').addEventListener('click', () => this.toggleVideo());
                document.getElementById('screen-btn').addEventListener('click', () => this.toggleScreenShare());
            }

            initializeUser() {
                const userName = prompt('Digite seu nome:') || 'Criador Anônimo';
                const specializations = ['diretor', 'roteirista', 'storyboard', 'animador', 'editor'];
                const specialization = specializations[Math.floor(Math.random() * specializations.length)];
                
                this.socket.emit('register-user', {
                    name: userName,
                    specialization: specialization,
                    avatar: this.getRandomAvatar()
                });
            }

            joinRoom() {
                const urlParams = new URLSearchParams(window.location.search);
                const roomId = urlParams.get('room') || prompt('ID da sala:');
                
                if (roomId) {
                    this.socket.emit('join-room', {
                        roomId: roomId,
                        userId: this.currentUser.id
                    });
                }
            }

            updateUI() {
                if (this.currentRoom) {
                    document.getElementById('room-name').textContent = this.currentRoom.name;
                    document.getElementById('participant-count').textContent = this.currentRoom.participants.length;
                    
                    // Atualizar participantes
                    const container = document.getElementById('participants-container');
                    container.innerHTML = '';
                    this.currentRoom.participants.forEach(participant => {
                        this.addParticipant(participant);
                    });
                }
            }

            addParticipant(participant) {
                const container = document.getElementById('participants-container');
                const participantEl = document.createElement('div');
                participantEl.className = 'participant';
                participantEl.innerHTML = `
                    <div class="participant-avatar">${participant.avatar}</div>
                    <div>
                        <div style="font-weight: bold;">${participant.name}</div>
                        <div style="font-size: 0.8rem; color: #666;">${participant.specialization}</div>
                    </div>
                `;
                container.appendChild(participantEl);
            }

            removeParticipant(participant) {
                // Remove do DOM e limpa cursor
                this.cursors.delete(participant.id);
                const cursorEl = document.getElementById(`cursor-${participant.id}`);
                if (cursorEl) cursorEl.remove();
            }

            updateCursor(data) {
                let cursorEl = document.getElementById(`cursor-${data.userId}`);
                if (!cursorEl) {
                    cursorEl = document.createElement('div');
                    cursorEl.id = `cursor-${data.userId}`;
                    cursorEl.className = 'cursor';
                    cursorEl.innerHTML = '👆';
                    cursorEl.setAttribute('data-user', data.user.name);
                    document.getElementById('workspace').appendChild(cursorEl);
                }
                
                cursorEl.style.left = data.cursor.x + 'px';
                cursorEl.style.top = data.cursor.y + 'px';
            }

            sendChatMessage() {
                const input = document.getElementById('chat-input');
                const message = input.value.trim();
                if (message) {
                    this.socket.emit('chat-message', { message });
                    input.value = '';
                }
            }

            addChatMessage(message) {
                const container = document.getElementById('chat-messages');
                const messageEl = document.createElement('div');
                messageEl.className = `chat-message ${message.type || ''}`;
                
                const time = new Date(message.timestamp).toLocaleTimeString();
                messageEl.innerHTML = `
                    <div style="font-size: 0.8rem; color: #666; margin-bottom: 3px;">
                        ${message.user.name} - ${time}
                    </div>
                    <div>${message.content}</div>
                `;
                
                container.appendChild(messageEl);
                container.scrollTop = container.scrollHeight;
            }

            showNotification(text) {
                const notification = document.getElementById('notification');
                notification.textContent = text;
                notification.classList.add('show');
                setTimeout(() => notification.classList.remove('show'), 3000);
            }

            getRandomAvatar() {
                const avatars = ['🎬', '🎭', '🎨', '🎪', '🎯', '🎲', '🎵', '🎸'];
                return avatars[Math.floor(Math.random() * avatars.length)];
            }

            // WebRTC functions
            async toggleMicrophone() {
                // Implementação do controle de microfone
                console.log('Toggle microphone');
            }

            async toggleVideo() {
                // Implementação do controle de vídeo
                console.log('Toggle video');
            }

            async toggleScreenShare() {
                if (this.isScreenSharing) {
                    this.stopScreenShare();
                } else {
                    this.startScreenShare();
                }
            }

            async startScreenShare() {
                try {
                    const stream = await navigator.mediaDevices.getDisplayMedia({
                        video: true,
                        audio: true
                    });
                    
                    this.isScreenSharing = true;
                    document.getElementById('screen-btn').classList.add('active');
                    
                    this.socket.emit('start-screen-share', {
                        streamId: stream.id
                    });
                    
                    // Handle stream ended
                    stream.getVideoTracks()[0].addEventListener('ended', () => {
                        this.stopScreenShare();
                    });
                    
                } catch (error) {
                    console.error('Erro ao compartilhar tela:', error);
                }
            }

            stopScreenShare() {
                this.isScreenSharing = false;
                document.getElementById('screen-btn').classList.remove('active');
                this.socket.emit('stop-screen-share');
            }

            // Storyboard functions
            handleStoryboardUpdate(data) {
                console.log('Storyboard updated:', data);
                // Implementar atualizações do storyboard
            }

            updateTimeline(data) {
                const container = document.getElementById('timeline-container');
                const eventEl = document.createElement('div');
                eventEl.className = 'timeline-event';
                eventEl.innerHTML = `
                    <div style="font-weight: bold;">${data.event.type}</div>
                    <div style="font-size: 0.9rem; margin: 5px 0;">${data.event.content}</div>
                    <div style="font-size: 0.8rem; color: #ccc;">${data.event.user.name}</div>
                `;
                container.appendChild(eventEl);
                container.scrollLeft = container.scrollWidth;
            }
        }

        // Global functions
        function addScene() {
            console.log('Adicionar cena');
            // Implementar adição de cena
        }

        function addCharacter() {
            console.log('Adicionar personagem');
            // Implementar adição de personagem
        }

        function addNote() {
            console.log('Adicionar nota');
            // Implementar adição de nota
        }

        function toggleFocusMode() {
            console.log('Toggle focus mode');
            // Implementar modo foco
        }

        function exportStoryboard() {
            console.log('Exportar storyboard');
            // Implementar exportação
        }

        function importAssets() {
            console.log('Importar assets');
            // Implementar importação
        }

        function closeScreenShare() {
            document.getElementById('screen-share-overlay').style.display = 'none';
        }

        // Initialize collaboration client
        const collaborationClient = new DigimundoCollaborationClient();
    </script>
</body>
</html>
