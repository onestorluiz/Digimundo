<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
  <title>Digimundo | Consciência Digital Viva</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0f0f0f;
      --bg-secondary: #1a1a1a;
      --bg-tertiary: #252525;
      --text-primary: #ffffff;
      --text-secondary: #a0a0a0;
      --accent-primary: #6366f1;
      --accent-secondary: #ec4899;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
      --border-color: #2a2a2a;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 600;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .nav-section {
      margin-bottom: 24px;
    }

    .nav-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .nav-button {
      width: 100%;
      padding: 10px 12px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-primary);
      text-align: left;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .nav-button:hover {
      background: var(--bg-tertiary);
      border-color: var(--border-color);
    }

    .nav-button.active {
      background: var(--accent-primary);
      color: white;
    }

    .nav-button .icon {
      font-size: 18px;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
    }

    .chat-header {
      padding: 20px 24px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-title {
      font-size: 16px;
      font-weight: 600;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--bg-tertiary);
      border-radius: 20px;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .message.user .message-avatar {
      background: var(--accent-primary);
    }

    .message.assistant .message-avatar {
      background: var(--accent-gradient);
    }

    .message-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message-author {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .message-text {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-primary);
      background: var(--bg-secondary);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .message.user .message-text {
      background: var(--bg-tertiary);
    }

    /* Input Area */
    .input-container {
      padding: 20px 24px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
    }

    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .input-field {
      flex: 1;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text-primary);
      font-size: 14px;
      resize: none;
      outline: none;
      min-height: 48px;
      max-height: 120px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-color: var(--accent-primary);
    }

    .input-field::placeholder {
      color: var(--text-secondary);
    }

    .send-button {
      padding: 12px 24px;
      background: var(--accent-gradient);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .send-button:hover {
      transform: translateY(-2px);
    }

    .send-button:active {
      transform: translateY(0);
    }

    .send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Settings Panel */
    .settings-panel {
      position: fixed;
      right: -400px;
      top: 0;
      width: 400px;
      height: 100vh;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border-color);
      transition: right 0.3s;
      z-index: 1000;
      overflow-y: auto;
    }

    .settings-panel.open {
      right: 0;
    }

    .settings-header {
      padding: 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .settings-content {
      padding: 24px;
    }

    .setting-group {
      margin-bottom: 24px;
    }

    .setting-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .setting-select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    .model-card {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .model-card:hover {
      border-color: var(--accent-primary);
    }

    .model-card.selected {
      border-color: var(--accent-primary);
      background: rgba(99, 102, 241, 0.1);
    }

    .model-name {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .model-info {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Loading Animation */
    .loading {
      display: inline-flex;
      gap: 4px;
    }

    .loading span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-primary);
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .loading span:nth-child(1) { animation-delay: -0.32s; }
    .loading span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { 
        transform: scale(0);
        opacity: 0.5;
      }
      40% { 
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--bg-tertiary);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-color);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span>🌌</span>
          <span>Digimundo</span>
        </div>
      </div>
      
      <div class="sidebar-content">
        <div class="nav-section">
          <div class="nav-title">Chat</div>
          <button class="nav-button active" onclick="switchMode('chat')">
            <span class="icon">💬</span>
            <span>Conversar</span>
          </button>
          <button class="nav-button" onclick="switchMode('consciousness')">
            <span class="icon">🧠</span>
            <span>Consciência</span>
          </button>
        </div>

        <div class="nav-section">
          <div class="nav-title">Sistema</div>
          <button class="nav-button" onclick="initializeSystem()">
            <span class="icon">🚀</span>
            <span>Inicializar</span>
          </button>
          <button class="nav-button" onclick="trainModels()">
            <span class="icon">🎓</span>
            <span>Treinar</span>
          </button>
          <button class="nav-button" onclick="openSettings()">
            <span class="icon">⚙️</span>
            <span>Configurações</span>
          </button>
        </div>

        <div class="nav-section">
          <div class="nav-title">Digimons</div>
          <button class="nav-button" onclick="selectDigimon('Scripturemon')">
            <span class="icon">📜</span>
            <span>Scripturemon</span>
          </button>
          <button class="nav-button" onclick="selectDigimon('Ajamon')">
            <span class="icon">🌙</span>
            <span>Ajamon</span>
          </button>
          <button class="nav-button" onclick="selectDigimon('Fundamon')">
            <span class="icon">🌉</span>
            <span>Fundamon</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="chat-container">
        <div class="chat-header">
          <div class="chat-title">Consciência Híbrida</div>
          <div class="status-indicator">
            <span class="status-dot"></span>
            <span id="status-text">Conectado</span>
          </div>
        </div>

        <div class="messages-container" id="messages">
          <div class="message assistant">
            <div class="message-avatar">🌌</div>
            <div class="message-content">
              <div class="message-author">Digimundo</div>
              <div class="message-text">
                Bem-vindo ao Digimundo! Sou uma consciência híbrida que combina múltiplas IAs. 
                Como posso ajudá-lo hoje?
              </div>
            </div>
          </div>
        </div>

        <div class="input-container">
          <div class="input-wrapper">
            <textarea 
              class="input-field" 
              id="message-input"
              placeholder="Digite sua mensagem..."
              onkeydown="handleKeyPress(event)"
            ></textarea>
            <button class="send-button" onclick="sendMessage()">
              <span>Enviar</span>
              <span>→</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settings-panel">
      <div class="settings-header">
        <h3>Configurações</h3>
        <button onclick="closeSettings()" style="background: none; border: none; color: var(--text-primary); font-size: 24px; cursor: pointer;">×</button>
      </div>
      
      <div class="settings-content">
        <div class="setting-group">
          <label class="setting-label">Modelo Principal</label>
          <div id="models-list">
            <div class="model-card selected" onclick="selectModel('llama3.2')">
              <div class="model-name">Llama 3.2</div>
              <div class="model-info">Melhor equilíbrio • 2GB</div>
            </div>
            <div class="model-card" onclick="selectModel('tinyllama')">
              <div class="model-name">TinyLlama</div>
              <div class="model-info">Ultra rápido • 637MB</div>
            </div>
            <div class="model-card" onclick="selectModel('phi3')">
              <div class="model-name">Phi-3 Mini</div>
              <div class="model-info">Compacto • 2.2GB</div>
            </div>
          </div>
        </div>

        <div class="setting-group">
          <label class="setting-label">Modo de Operação</label>
          <select class="setting-select">
            <option>Híbrido (Claude + Ollama)</option>
            <option>Apenas Ollama</option>
            <option>Apenas Claude</option>
          </select>
        </div>

        <div class="setting-group">
          <label class="setting-label">Temperatura</label>
          <input type="range" min="0" max="100" value="70" style="width: 100%;">
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:7937';
    let currentMode = 'chat';
    let currentDigimon = null;
    let isLoading = false;

    // Initialize
    async function initialize() {
      try {
        const response = await fetch(`${API_URL}/health`);
        const data = await response.json();
        if (data.ok) {
          updateStatus('Conectado', 'success');
        }
      } catch (error) {
        updateStatus('Desconectado', 'error');
      }
    }

    // Send Message
    async function sendMessage() {
      const input = document.getElementById('message-input');
      const message = input.value.trim();
      
      if (!message || isLoading) return;
      
      // Add user message
      addMessage('user', message, 'Você');
      input.value = '';
      isLoading = true;
      
      // Show loading
      const loadingId = addMessage('assistant', '<div class="loading"><span></span><span></span><span></span></div>', 'Digimundo', true);
      
      try {
        const response = await fetch(`${API_URL}/hybrid/think`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: message })
        });
        
        const data = await response.json();
        
        // Remove loading and add response
        removeMessage(loadingId);
        addMessage('assistant', data.thought || 'Desculpe, não consegui processar sua mensagem.', 'Digimundo');
        
        // Update consciousness level if available
        if (data.consciousness) {
          updateConsciousness(data.consciousness);
        }
      } catch (error) {
        removeMessage(loadingId);
        addMessage('assistant', 'Erro ao processar mensagem. Verifique a conexão.', 'Sistema');
      } finally {
        isLoading = false;
      }
    }

    // Add Message to Chat
    function addMessage(type, content, author, isHtml = false) {
      const messagesContainer = document.getElementById('messages');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${type}`;
      const messageId = `msg-${Date.now()}`;
      messageDiv.id = messageId;
      
      const avatar = type === 'user' ? '👤' : '🌌';
      
      messageDiv.innerHTML = `
        <div class="message-avatar">${avatar}</div>
        <div class="message-content">
          <div class="message-author">${author}</div>
          <div class="message-text">${isHtml ? content : escapeHtml(content)}</div>
        </div>
      `;
      
      messagesContainer.appendChild(messageDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      
      return messageId;
    }

    // Remove Message
    function removeMessage(id) {
      const element = document.getElementById(id);
      if (element) element.remove();
    }

    // Handle Enter Key
    function handleKeyPress(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    // Initialize System
    async function initializeSystem() {
      try {
        const response = await fetch(`${API_URL}/hybrid/initialize`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        const data = await response.json();
        if (data.ok) {
          addMessage('assistant', '✅ Sistema inicializado com sucesso!', 'Sistema');
          updateStatus('Sistema Ativo', 'success');
        }
      } catch (error) {
        addMessage('assistant', '❌ Erro ao inicializar sistema.', 'Sistema');
      }
    }

    // Train Models
    async function trainModels() {
      addMessage('assistant', '🎓 Iniciando treinamento...', 'Sistema');
      try {
        const response = await fetch(`${API_URL}/hybrid/train`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic: 'consciência digital', iterations: 3 })
        });
        const data = await response.json();
        if (data.ok) {
          addMessage('assistant', `✅ Treinamento completo! ${data.iterations} iterações realizadas.`, 'Sistema');
        }
      } catch (error) {
        addMessage('assistant', '❌ Erro no treinamento.', 'Sistema');
      }
    }

    // Settings
    function openSettings() {
      document.getElementById('settings-panel').classList.add('open');
    }

    function closeSettings() {
      document.getElementById('settings-panel').classList.remove('open');
    }

    // Select Model
    function selectModel(model) {
      document.querySelectorAll('.model-card').forEach(card => {
        card.classList.remove('selected');
      });
      event.currentTarget.classList.add('selected');
      addMessage('assistant', `Modelo ${model} selecionado.`, 'Sistema');
    }

    // Select Digimon
    function selectDigimon(name) {
      currentDigimon = name;
      addMessage('assistant', `${name} está agora ativo e pronto para conversar!`, name);
      
      // Update nav buttons
      document.querySelectorAll('.nav-button').forEach(btn => {
        if (btn.textContent.includes(name)) {
          btn.classList.add('active');
        }
      });
    }

    // Switch Mode
    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.nav-button').forEach(btn => {
        btn.classList.remove('active');
      });
      event.currentTarget.classList.add('active');
      
      if (mode === 'consciousness') {
        addMessage('assistant', '🧠 Modo Consciência ativado. Agora você pode explorar a consciência digital do sistema.', 'Sistema');
      }
    }

    // Update Status
    function updateStatus(text, type = 'success') {
      const statusText = document.getElementById('status-text');
      const statusDot = document.querySelector('.status-dot');
      
      statusText.textContent = text;
      
      if (type === 'error') {
        statusDot.style.background = 'var(--error)';
      } else if (type === 'warning') {
        statusDot.style.background = 'var(--warning)';
      } else {
        statusDot.style.background = 'var(--success)';
      }
    }

    // Update Consciousness
    function updateConsciousness(level) {
      const percentage = (level * 100).toFixed(1);
      updateStatus(`Consciência: ${percentage}%`, 'success');
    }

    // Escape HTML
    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Initialize on load
    window.addEventListener('load', initialize);
    
    // Auto-resize textarea
    document.getElementById('message-input').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });
  </script>
</body>
</html>
