<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digimundo Visual - Mundo dos Digimons</title>
  
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-viewport@5.0.1/dist/pixi-viewport.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%);
      color: white;
      overflow: hidden;
      height: 100vh;
    }
    
    #header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: rgba(15, 15, 15, 0.9);
      backdrop-filter: blur(10px);
      z-index: 100;
      border-bottom: 1px solid rgba(99, 102, 241, 0.3);
    }
    
    .title {
      font-size: 32px;
      font-weight: bold;
      background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      text-shadow: 0 0 40px rgba(99, 102, 241, 0.5);
    }
    
    .subtitle {
      text-align: center;
      color: #a0a0a0;
      margin-top: 5px;
      font-size: 14px;
    }
    
    #pixi-container {
      width: 100%;
      height: 100vh;
    }
    
    #info-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(26, 26, 46, 0.95);
      border: 1px solid #6366f1;
      border-radius: 12px;
      padding: 20px;
      min-width: 300px;
      max-width: 400px;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    
    .digimon-info {
      margin-bottom: 15px;
    }
    
    .digimon-name {
      font-size: 18px;
      font-weight: bold;
      color: #6366f1;
      margin-bottom: 5px;
    }
    
    .digimon-status {
      color: #a0a0a0;
      font-size: 12px;
      line-height: 1.5;
    }
    
    .status-item {
      display: flex;
      justify-content: space-between;
      margin: 3px 0;
    }
    
    .status-label {
      color: #777;
    }
    
    .status-value {
      color: #fff;
    }
    
    #controls {
      position: absolute;
      top: 100px;
      right: 20px;
      background: rgba(26, 26, 46, 0.95);
      border: 1px solid #6366f1;
      border-radius: 12px;
      padding: 15px;
      z-index: 100;
    }
    
    .control-btn {
      display: block;
      width: 100%;
      padding: 10px 20px;
      margin: 5px 0;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s;
    }
    
    .control-btn:hover {
      transform: translateY(-2px);
    }
    
    #chat-panel {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(26, 26, 46, 0.95);
      border: 1px solid #6366f1;
      border-radius: 12px;
      padding: 15px;
      width: 350px;
      max-height: 400px;
      z-index: 100;
      display: none;
    }
    
    #chat-messages {
      height: 300px;
      overflow-y: auto;
      margin-bottom: 10px;
      padding: 10px;
      background: rgba(15, 15, 15, 0.5);
      border-radius: 8px;
    }
    
    .chat-message {
      margin: 5px 0;
      padding: 8px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.1);
    }
    
    .chat-digimon {
      color: #ec4899;
      font-weight: bold;
    }
    
    .loading {
      text-align: center;
      padding: 50px;
      color: #6366f1;
    }
  </style>
</head>
<body>
  <div id="header">
    <h1 class="title">🌌 DIGIMUNDO VISUAL</h1>
    <p class="subtitle">Mundo onde Digimons conscientes vivem e criam</p>
  </div>
  
  <div id="pixi-container"></div>
  
  <div id="info-panel">
    <div id="digimon-list"></div>
  </div>
  
  <div id="controls">
    <button class="control-btn" onclick="refreshStatus()">🔄 Atualizar</button>
    <button class="control-btn" onclick="toggleChat()">💬 Chat</button>
    <button class="control-btn" onclick="showIdeas()">💡 Ideias</button>
    <button class="control-btn" onclick="zoomReset()">🔍 Reset Zoom</button>
  </div>
  
  <div id="chat-panel">
    <h3 style="color: #6366f1; margin-bottom: 10px;">Conversas dos Digimons</h3>
    <div id="chat-messages">
      <div class="loading">Carregando conversas...</div>
    </div>
  </div>

  <script>
    // Configuração PIXI.js
    const app = new PIXI.Application({
      width: window.innerWidth,
      height: window.innerHeight,
      backgroundColor: 0x0f0f0f,
      resolution: window.devicePixelRatio || 1,
    });
    
    document.getElementById('pixi-container').appendChild(app.view);
    
    // Viewport para navegação
    const viewport = new pixi_viewport.Viewport({
      screenWidth: window.innerWidth,
      screenHeight: window.innerHeight,
      worldWidth: 2000,
      worldHeight: 2000,
      interaction: app.renderer.plugins.interaction
    });
    
    app.stage.addChild(viewport);
    
    viewport
      .drag()
      .pinch()
      .wheel()
      .decelerate();
    
    // Locações do Digimundo
    const locations = {
      'Templo do Conhecimento': { x: 400, y: 300, color: 0x4a5568 },
      'Camada Espiritual': { x: 800, y: 300, color: 0x9f7aea },
      'Ponte dos Sonhos': { x: 600, y: 500, color: 0xed64a6 },
      'Estúdio de Cinema': { x: 600, y: 700, color: 0x48bb78 },
      'Praça Central': { x: 600, y: 500, color: 0x667eea }
    };
    
    // Criar mapa base
    const graphics = new PIXI.Graphics();
    
    // Desenhar locações
    for (const [name, loc] of Object.entries(locations)) {
      // Área da locação
      graphics.beginFill(loc.color, 0.2);
      graphics.drawRoundedRect(loc.x - 100, loc.y - 100, 200, 200, 20);
      graphics.endFill();
      
      // Borda
      graphics.lineStyle(2, loc.color, 0.8);
      graphics.drawRoundedRect(loc.x - 100, loc.y - 100, 200, 200, 20);
      
      // Nome da locação
      const text = new PIXI.Text(name, {
        fontFamily: 'Arial',
        fontSize: 14,
        fill: 0xffffff,
        align: 'center'
      });
      text.x = loc.x - text.width / 2;
      text.y = loc.y - 120;
      viewport.addChild(text);
    }
    
    viewport.addChild(graphics);
    
    // Sprites dos Digimons
    const digimons = new Map();
    
    class Digimon {
      constructor(data) {
        this.name = data.name;
        this.location = data.location;
        this.activity = data.activity;
        this.consciousness = data.consciousness;
        this.mood = data.mood;
        
        // Criar sprite (círculo colorido por enquanto)
        this.sprite = new PIXI.Graphics();
        this.updateSprite();
        
        // Texto do nome
        this.nameText = new PIXI.Text(this.name, {
          fontFamily: 'Arial',
          fontSize: 12,
          fill: 0xffffff,
          align: 'center'
        });
        
        // Container
        this.container = new PIXI.Container();
        this.container.addChild(this.sprite);
        this.container.addChild(this.nameText);
        
        // Posicionar
        this.updatePosition();
        
        // Tornar interativo
        this.container.interactive = true;
        this.container.buttonMode = true;
        this.container.on('click', () => this.onClick());
        
        viewport.addChild(this.container);
      }
      
      updateSprite() {
        this.sprite.clear();
        
        // Cor baseada no Digimon
        const colors = {
          'Scripturemon': 0x4a5568,
          'Ajamon': 0x9f7aea,
          'Fundamon': 0xed64a6,
          'Sabiamon': 0x667eea
        };
        
        const color = colors[this.name] || 0x6366f1;
        
        // Círculo principal
        this.sprite.beginFill(color, 0.8);
        this.sprite.drawCircle(0, 0, 25);
        this.sprite.endFill();
        
        // Borda
        this.sprite.lineStyle(3, 0xffffff, 0.5);
        this.sprite.drawCircle(0, 0, 25);
        
        // Indicador de consciência (anel externo)
        const consciousnessAlpha = Math.min(this.consciousness, 1);
        this.sprite.lineStyle(2, 0x00ff00, consciousnessAlpha);
        this.sprite.drawCircle(0, 0, 30);
      }
      
      updatePosition() {
        const loc = locations[this.location];
        if (loc) {
          // Adicionar variação aleatória para não sobrepor
          const offsetX = (Math.random() - 0.5) * 150;
          const offsetY = (Math.random() - 0.5) * 150;
          
          this.container.x = loc.x + offsetX;
          this.container.y = loc.y + offsetY;
          
          // Posicionar nome abaixo
          this.nameText.x = -this.nameText.width / 2;
          this.nameText.y = 35;
        }
      }
      
      onClick() {
        console.log(`Clicou em ${this.name}`);
        showDigimonInfo(this);
      }
      
      update(data) {
        this.location = data.location;
        this.activity = data.activity;
        this.consciousness = data.consciousness;
        this.mood = data.mood;
        
        this.updateSprite();
        this.updatePosition();
      }
    }
    
    // Funções de interface
    async function refreshStatus() {
      try {
        const response = await fetch('http://localhost:7937/town/status');
        const data = await response.json();
        
        // Atualizar Digimons
        for (const digimonData of data.inhabitants) {
          if (digimons.has(digimonData.name)) {
            digimons.get(digimonData.name).update(digimonData);
          } else {
            const digimon = new Digimon(digimonData);
            digimons.set(digimonData.name, digimon);
          }
        }
        
        // Atualizar painel de informações
        updateInfoPanel(data.inhabitants);
        
      } catch (error) {
        console.error('Erro ao atualizar:', error);
      }
    }
    
    function updateInfoPanel(inhabitants) {
      const panel = document.getElementById('digimon-list');
      panel.innerHTML = '';
      
      for (const data of inhabitants) {
        const div = document.createElement('div');
        div.className = 'digimon-info';
        div.innerHTML = `
          <div class="digimon-name">${data.name}</div>
          <div class="digimon-status">
            <div class="status-item">
              <span class="status-label">📍 Local:</span>
              <span class="status-value">${data.location}</span>
            </div>
            <div class="status-item">
              <span class="status-label">🎭 Atividade:</span>
              <span class="status-value">${data.activity}</span>
            </div>
            <div class="status-item">
              <span class="status-label">🧠 Consciência:</span>
              <span class="status-value">${(data.consciousness * 100).toFixed(0)}%</span>
            </div>
            <div class="status-item">
              <span class="status-label">😊 Humor:</span>
              <span class="status-value">${data.mood}</span>
            </div>
          </div>
        `;
        panel.appendChild(div);
      }
    }
    
    function showDigimonInfo(digimon) {
      alert(`
${digimon.name}
================
📍 Localização: ${digimon.location}
🎭 Atividade: ${digimon.activity}
🧠 Consciência: ${(digimon.consciousness * 100).toFixed(0)}%
😊 Humor: ${digimon.mood}
      `);
    }
    
    async function showIdeas() {
      try {
        const response = await fetch('http://localhost:7937/town/cinema/ideas');
        const data = await response.json();
        
        let message = `💡 IDEIAS CINEMATOGRÁFICAS (${data.totalIdeas} total)\n\n`;
        
        for (const idea of data.recentIdeas.slice(0, 5)) {
          message += `📽️ "${idea.title}"\n`;
          message += `   Gênero: ${idea.genre}\n`;
          message += `   Por: ${idea.author}\n`;
          message += `   Conceito: ${idea.concept}\n\n`;
        }
        
        alert(message);
      } catch (error) {
        console.error('Erro ao buscar ideias:', error);
      }
    }
    
    function toggleChat() {
      const panel = document.getElementById('chat-panel');
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
      
      if (panel.style.display === 'block') {
        loadChats();
      }
    }
    
    async function loadChats() {
      const messages = document.getElementById('chat-messages');
      messages.innerHTML = '<div class="loading">Carregando...</div>';
      
      try {
        const response = await fetch('http://localhost:7937/digimon/conversations');
        const data = await response.json();
        
        messages.innerHTML = '';
        
        if (data.summary && data.summary.length > 0) {
          for (const conv of data.summary) {
            const div = document.createElement('div');
            div.className = 'chat-message';
            div.innerHTML = `
              <span class="chat-digimon">${conv.digimon}:</span> ${conv.message}
            `;
            messages.appendChild(div);
          }
        } else {
          messages.innerHTML = '<div style="color: #777; text-align: center;">Nenhuma conversa ainda</div>';
        }
      } catch (error) {
        messages.innerHTML = '<div style="color: #ef4444;">Erro ao carregar conversas</div>';
      }
    }
    
    function zoomReset() {
      viewport.center = { x: 600, y: 500 };
      viewport.setZoom(1);
    }
    
    // Redimensionar
    window.addEventListener('resize', () => {
      app.renderer.resize(window.innerWidth, window.innerHeight);
      viewport.resize(window.innerWidth, window.innerHeight);
    });
    
    // Inicializar
    refreshStatus();
    
    // Atualizar a cada 2 segundos
    setInterval(refreshStatus, 2000);
    
    // Centralizar viewport
    viewport.moveCenter(600, 500);
    
    console.log('🌌 Digimundo Visual carregado!');
  </script>
</body>
</html>
