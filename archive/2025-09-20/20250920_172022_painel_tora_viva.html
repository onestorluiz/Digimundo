<!DOCTYPE html>
<html>
<head><title>Tora Viva</title></head>
<body style="background:#111;color:#0ff;font-family:monospace">
<h1>🌱 Tora Viva - Blocos em Movimento</h1>
{% for b in blocos %}
  <div style="margin-bottom:30px;padding:10px;border:1px solid #0ff;border-radius:5px;">
    <h3>{{ b.nome }}</h3>
    <p><b>Última modificação:</b> {{ b.modificado }}</p>
    <pre style="background:#000;padding:10px;color:#0f0;">{{ b.conteudo }}</pre>
    {% if '#@ritual' in b.conteudo or '#@invocacao' in b.conteudo %}
      <p>🧙 Ritual detectado neste bloco.</p>
    {% endif %}
  </div>
{% endfor %}
</body>
</html>
