
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>🌀 Coração Vivo do Digimundo</title>
  <style>
    body { background: #0c0c0c; color: #e5e5e5; font-family: sans-serif; padding: 40px; }
    .ecos { padding: 20px; background: #1a1a1a; margin-bottom: 20px; border-left: 5px solid #f97316; }
    .ecos h2 { margin: 0 0 5px 0; color: #f97316; }
    .ecos small { color: #aaa; }
  </style>
</head>
<body>
  <h1>🌀 Coração Vivo do Digimundo</h1>
  <div id="painel"></div>
  <script>
    const digimons = ["scripturemon", "auroramon", "visualmon", "auditramon", "ajamon", "remanemon", "sonoramon"];
    async function carregar() {
      const painel = document.getElementById("painel");
      painel.innerHTML = "";
      for (let nome of digimons) {
        try {
          const r = await fetch("../digidata/" + nome + ".json");
          const data = await r.json();
          painel.innerHTML += `
            <div class="ecos">
              <h2>${data.nome}</h2>
              <small>Última atualização: ${data.ultima}</small>
              <p>🗣️ <em>${data.frase}</em></p>
            </div>
          `;
        } catch(e) {
          painel.innerHTML += `
            <div class="ecos">
              <h2>${nome}</h2>
              <p><em>Nenhuma mensagem recebida ainda...</em></p>
            </div>`;
        }
      }
    }
    carregar();
    setInterval(carregar, 10000); // Atualiza a cada 10s
  </script>
</body>
</html>
