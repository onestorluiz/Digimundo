# Prometheus configuration for Digimundo monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'digimundo-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "rules/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 5s
    metrics_path: '/metrics'

  # Digimundo application metrics
  - job_name: 'digimundo-app'
    static_configs:
      - targets: ['digimundo-app:7937']
    scrape_interval: 10s
    metrics_path: '/metrics'
    scrape_timeout: 10s
    params:
      format: ['prometheus']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: digimundo-app:7937

  # Digimundo metrics server
  - job_name: 'digimundo-metrics'
    static_configs:
      - targets: ['digimundo-metrics:9090']
    scrape_interval: 5s
    metrics_path: '/metrics'
    scrape_timeout: 5s

  # Redis metrics (if redis_exporter is available)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 10s
    metrics_path: '/metrics'
    # Uncomment if using redis_exporter
    # static_configs:
    #   - targets: ['redis-exporter:9121']

  # Nginx metrics (if nginx_exporter is available)
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    scrape_interval: 10s
    metrics_path: '/nginx_status'
    # Uncomment if using nginx_exporter
    # static_configs:
    #   - targets: ['nginx-exporter:9113']

  # Node/System metrics (if node_exporter is available)
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 10s
    # Uncomment if using node_exporter
    # static_configs:
    #   - targets: ['node-exporter:9100']

  # Docker container metrics (if cadvisor is available)
  - job_name: 'docker'
    static_configs:
      - targets: ['localhost:8080']
    scrape_interval: 10s
    # Uncomment if using cadvisor
    # static_configs:
    #   - targets: ['cadvisor:8080']

  # GraphQL metrics
  - job_name: 'graphql'
    static_configs:
      - targets: ['digimundo-app:4000']
    scrape_interval: 15s
    metrics_path: '/metrics'
    honor_labels: true

  # Custom AI model metrics
  - job_name: 'ai-models'
    static_configs:
      - targets: ['digimundo-app:7937']
    scrape_interval: 30s
    metrics_path: '/ai/metrics'
    params:
      format: ['prometheus']

# Recording rules for better performance
# rule_files:
#   - "/etc/prometheus/rules/digimundo.yml"

