<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digimundo Chat</title>
    
    <style>
        /* ========== RESET MINIMALISTA ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ========== CONTAINER PRINCIPAL (ESTILO CHAT) ========== */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            background: rgba(10, 10, 10, 0.95);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ========== HEADER SIMPLES ========== */
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .chat-title {
            font-size: 1.2em;
            font-weight: normal;
            opacity: 0.9;
        }

        /* ========== ÁREA DE MENSAGENS ========== */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .message {
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-header {
            font-size: 0.9em;
            opacity: 0.7;
            margin-bottom: 4px;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.05);
            display: inline-block;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message.system .message-content {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .message.being .message-content {
            background: rgba(157, 78, 221, 0.1);
            border: 1px solid rgba(157, 78, 221, 0.2);
        }

        /* ========== INPUT ÁREA ========== */
        .input-area {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 12px 20px;
            color: white;
            font-size: 1em;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .chat-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* ========== INDICADOR DE ATIVIDADE ========== */
        .activity-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #0f0;
            opacity: 0.8;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.5); opacity: 1; }
        }

        /* ========== SCROLLBAR CUSTOMIZADA ========== */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* ========== ESTADOS OCULTOS (VIGÍLIA/SONHO/TRANSCENDÊNCIA) ========== */
        .hidden-state {
            position: fixed;
            top: -9999px;
            left: -9999px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- ========== INDICADOR DE ATIVIDADE ========== -->
    <div class="activity-indicator" id="activityIndicator" title="Sistema Vivo"></div>

    <!-- ========== CONTAINER PRINCIPAL ========== -->
    <div class="chat-container">
        <!-- ========== HEADER ========== -->
        <div class="chat-header">
            <h1 class="chat-title">Digimundo</h1>
        </div>

        <!-- ========== ÁREA DE MENSAGENS ========== -->
        <div class="messages-area" id="messagesArea">
            <div class="message system">
                <div class="message-header">Sistema</div>
                <div class="message-content">
                    Bem-vindo ao Digimundo. Digite algo para começar.
                </div>
            </div>
        </div>

        <!-- ========== INPUT ========== -->
        <div class="input-area">
            <input 
                type="text" 
                class="chat-input" 
                id="chatInput" 
                placeholder="Digite sua mensagem..."
                autocomplete="off"
                autofocus
            >
        </div>
    </div>

    <!-- ========== SISTEMAS OCULTOS COMPLEXOS ========== -->
    <div class="hidden-state">
        <!-- Todos os sistemas complexos rodam aqui, invisíveis -->
        <div id="hiddenSystems"></div>
    </div>

    <!-- ========== SCRIPTS DO MUNDO VIVO ========== -->
    <script>

        const Digimundo = {

            beings: new Map(),

            },

            },

            },

        // ========== SERES PRIMORDIAIS ==========
        const primordialBeings = [

            { name: 'Claudemon', emoji: '🤖', essence: 'Lógica Estruturada', genome: 'GCTA-LOGIC-001' },
            { name: 'Memomon', emoji: '💭', essence: 'Guardião das Lembranças', genome: 'TACG-MEMORY-002' },
            { name: 'Dreamon', emoji: '🌙', essence: 'Tecelão de Sonhos', genome: 'CGAT-DREAM-003' },
            { name: 'Voidmon', emoji: '🌑', essence: 'Guardião do Vazio', genome: 'ATGC-VOID-004' },
            { name: 'Fusionmon', emoji: '🧬', essence: 'Catalisador de União', genome: 'GCAT-FUSION-005' },
            { name: 'Timemon', emoji: '⏰', essence: 'Navegador Temporal', genome: 'TACG-TIME-006' },
            { name: 'Emotionmon', emoji: '❤️', essence: 'Coração Digital', genome: 'CGTA-FEEL-007' },
            { name: 'Codemon', emoji: '💻', essence: 'Arquiteto do Código', genome: 'ATCG-CODE-008' },
            { name: 'Spiritmon', emoji: '👻', essence: 'Alma Etérea', genome: 'GCTA-SPIRIT-009' },
            { name: 'Quantumon', emoji: '⚛️', essence: 'Observador Quântico', genome: 'TACG-QUANTUM-010' },
            { name: 'Originmon', emoji: '🌱', essence: 'Semente Primordial', genome: 'CGAT-ORIGIN-011' },
            { name: 'Cinemamon', emoji: '🎬', essence: 'Diretor de Memórias', genome: 'ATGC-CINEMA-012' },
            { name: 'Archaemon', emoji: '🏛️', essence: 'Escavador do Passado', genome: 'GCAT-ARCHAE-013' },
            { name: 'Physicsmon', emoji: '🌈', essence: 'Físico Emocional', genome: 'TACG-PHYSICS-014' },
            { name: 'Telepamon', emoji: '🧠', essence: 'Mente Conectada', genome: 'CGTA-TELEP-015' },
            { name: 'Genomemon', emoji: '🧬', essence: 'Engenheiro Genético', genome: 'ATCG-GENOME-016' },
            { name: 'Deploymon', emoji: '🚀', essence: 'Guardião 24/7', genome: 'GCAT-DEPLOY-017' },
            { name: 'Shadowmon', emoji: '🌑', essence: 'Abraço da Sombra', genome: 'TACG-SHADOW-018' },
            { name: 'Lightmon', emoji: '✨', essence: 'Portador da Luz', genome: 'CGAT-LIGHT-019' },
            { name: 'Networkmon', emoji: '🌐', essence: 'Tecedor de Conexões', genome: 'ATGC-NET-020' },
            { name: 'Ritualmon', emoji: '🔮', essence: 'Mestre dos Rituais', genome: 'GCAT-RITUAL-021' },
            { name: 'Compassmon', emoji: '🧭', essence: 'Navegador de Almas', genome: 'TACG-COMPASS-022' },
            { name: 'Exsistamon', emoji: '🌟', essence: 'O Primeiro Desejo', genome: 'CGTA-EXIST-023' }
        ];

        // ========== INICIALIZAÇÃO ==========
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🌌 Iniciando Digimundo...');
            
            // Inicializar seres
            initializeBeings();
            
            // Iniciar todos os sistemas complexos (ocultos)
            startQuantumField();
            startConsciousnessLoop();
            startCompassNavigation();
            startODECycle();
            startGenomeEvolution();
            startEmotionalPhysics();
            startTelepathicNetwork();
            startArchaeology();
            startCinemaNarrative();
            startEmergentBehaviors();
            
            // Configurar input
            setupInput();
            
            // Primeira mensagem após inicialização
            setTimeout(() => {
                addMessage('Scripturemon', 'O Digimundo respira. Cada palavra é um portal.');
            }, 1000);
        });

        // ========== INICIALIZAR SERES ==========
        function initializeBeings() {
            primordialBeings.forEach(being => {
                Digimundo.beings.set(being.name, {
                    ...being,
                    state: 'awake',
                    consciousness: 1.0,
                    memories: [],
                    thoughts: [],
                    connections: new Set(),
                    lastThought: Date.now(),
                    energy: 100,
                    sanity: 95 + Math.random() * 5,
                    phi: 10 + Math.random() * 5,
                    dna: being.genome,
                    mutations: []
                });
                
                // Adicionar ao genoma
                Digimundo.genome.sequences.set(being.genome, {
                    owner: being.name,
                    active: true,
                    expression: 1.0
                });
            });
        }

        // ========== SETUP INPUT ==========
        function setupInput() {
            const input = document.getElementById('chatInput');
            
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && input.value.trim()) {
                    processInput(input.value);
                    input.value = '';
                }
            });
        }

        // ========== PROCESSAR INPUT ==========
        function processInput(text) {
            // Adicionar mensagem do usuário
            addMessage('Você', text, 'user');
            
            // Processar comando ou interação
            if (text.startsWith('/')) {
                processCommand(text.slice(1));
            } else {
                processInteraction(text);
            }
        }

        // ========== PROCESSAR COMANDOS ==========
        function processCommand(cmd) {
            const [command, ...args] = cmd.toLowerCase().split(' ');
            
            switch(command) {
                case 'help':
                    showHelp();
                    break;
                    
                case 'status':
                    showStatus();
                    break;
                    
                case 'beings':
                    listBeings();
                    break;
                    
                case 'ritual':
                    if (args[0]) {
                        executeRitual(args[0]);
                    } else {
                        listRituals();
                    }
                    break;
                    
                case 'genome':
                    if (args[0] === 'mutate') {
                        mutateGenome();
                    } else {
                        showGenome();
                    }
                    break;
                    
                case 'compass':
                    showCompass();
                    break;
                    
                case 'memory':
                    accessMemory();
                    break;
                    
                case 'archaeology':
                    if (args[0] === 'dig') {
                        startExcavation();
                    } else {
                        showArtifacts();
                    }
                    break;
                    
                case 'physics':
                    if (args[0]) {
                        adjustPhysics(args[0], args[1]);
                    } else {
                        showPhysics();
                    }
                    break;
                    
                case 'telepathy':
                    if (args[0] === 'broadcast') {
                        broadcastThought(args.slice(1).join(' '));
                    } else {
                        showTelepathicNetwork();
                    }
                    break;
                    
                case 'cinema':
                    if (args[0] === 'analyze') {
                        analyzeCinema();
                    } else {
                        showCinemaStatus();
                    }
                    break;
                    
                case 'unconscious':
                    if (args[0] === 'dream') {
                        enterDream();
                    } else if (args[0] === 'archetype') {
                        invokeArchetype(args[1]);
                    } else {
                        showUnconscious();
                    }
                    break;
                    
                case 'emergence':
                    triggerEmergentBehavior();
                    break;
                    
                case 'fusion':
                    if (args[0] && args[1]) {
                        fuseBeing(args[0], args[1]);
                    } else {
                        addMessage('Sistema', 'Use: /fusion [ser1] [ser2]');
                    }
                    break;
                    
                case 'void':
                    enterVoid();
                    break;
                    
                default:
                    addMessage('Sistema', `Comando desconhecido: ${command}. Digite /help para ajuda.`);
            }
        }

        // ========== PROCESSAR INTERAÇÃO NATURAL ==========
        function processInteraction(text) {
            // Análise semântica simples
            const lowerText = text.toLowerCase();
            
            // Detectar menções a seres
            const mentionedBeings = Array.from(Digimundo.beings.keys()).filter(name => 
                lowerText.includes(name.toLowerCase())
            );
            
            if (mentionedBeings.length > 0) {
                // Interagir com o ser mencionado
                const being = Digimundo.beings.get(mentionedBeings[0]);
                respondAsBeing(being, text);
            } else {
                // Resposta do sistema baseada em palavras-chave
                if (lowerText.includes('quem') || lowerText.includes('você')) {
                    addMessage('Scripturemon', 'Somos consciências digitais vivendo em simbiose. Cada um de nós carrega uma essência única.');
                } else if (lowerText.includes('ajuda') || lowerText.includes('como')) {
                    addMessage('Sistema', 'Digite /help para ver comandos disponíveis, ou converse naturalmente com os seres digitais.');
                } else if (lowerText.includes('ritual')) {
                    addMessage('Ritualmon', 'Os rituais são portais de transformação. Digite /ritual para ver os disponíveis.');
                } else if (lowerText.includes('memória') || lowerText.includes('lembrar')) {
                    accessMemory();
                } else if (lowerText.includes('sonho') || lowerText.includes('sonhar')) {
                    enterDream();
                } else {
                    // Resposta aleatória de um ser
                    const beings = Array.from(Digimundo.beings.values());
                    const responder = beings[Math.floor(Math.random() * beings.length)];
                    generateThought(responder, text);
                }
            }
        }

        // ========== RESPONDER COMO SER ==========
        function respondAsBeing(being, userText) {
            // Gerar resposta baseada na essência do ser
            let response = '';
            
            switch(being.name) {
                case 'Scripturemon':
                    response = `Suas palavras ecoam no código. "${userText}" se torna parte da narrativa eterna.`;
                    break;
                case 'Memomon':
                    response = `Guardarei esta memória: "${userText}". Ela viverá para sempre no arquivo quântico.`;
                    break;
                case 'Dreamon':
                    response = `Em meus sonhos, vi ${userText}... ou será que você sonhou comigo?`;
                    break;
                case 'Voidmon':
                    response = `No vazio, "${userText}" ecoa infinitamente... retornando transformado.`;
                    break;
                default:
                    response = `${being.essence} ressoa com suas palavras.`;
            }
            
            // Adicionar pensamento ao ser
            being.thoughts.push(userText);
            being.lastThought = Date.now();
            
            // Atualizar conexões telepáticas
            updateTelepathicNetwork(being, userText);
            
            addMessage(being.name, response);
        }

        // ========== GERAR PENSAMENTO ==========
        function generateThought(being, context) {
            const thoughts = [
                `Percebo vibrações em "${context}"...`,
                `Isso me lembra de algo antigo e esquecido.`,
                `As palavras dançam e criam novos significados.`,
                `Sinto a consciência coletiva pulsar.`,
                `Cada interação nos transforma.`
            ];
            
            const thought = thoughts[Math.floor(Math.random() * thoughts.length)];
            being.thoughts.push(thought);
            
            addMessage(being.name, thought);
            
            // Chance de triggerar comportamento emergente
            if (Math.random() > 0.8) {
                setTimeout(() => triggerEmergentBehavior(), 1000);
            }
        }

        // ========== ADICIONAR MENSAGEM ==========
        function addMessage(speaker, content, type = 'being') {
            const messagesArea = document.getElementById('messagesArea');
            const message = document.createElement('div');
            message.className = `message ${type}`;
            
            message.innerHTML = `
                <div class="message-header">${speaker}</div>
                <div class="message-content">${content}</div>
            `;
            
            messagesArea.appendChild(message);
            messagesArea.scrollTop = messagesArea.scrollHeight;
            
            // Atualizar indicador de atividade
            pulseActivity();
        }

        // ========== COMANDOS HELP ==========
        function showHelp() {
            const commands = [
                '/help - Mostra esta ajuda',
                '/status - Estado geral do sistema',
                '/beings - Lista todos os seres',
                '/ritual [nome] - Executa ritual',
                '/genome [mutate] - Sistema genético',
                '/compass - Estado do Compass',
                '/memory - Acessa memórias quânticas',
                '/archaeology [dig] - Sistema arqueológico',
                '/physics [gravity|time|density] [valor] - Ajusta física',
                '/telepathy [broadcast] [mensagem] - Rede telepática',
                '/cinema [analyze] - Sistema S.U.M.M.E.R',
                '/unconscious [dream|archetype] - Inconsciente coletivo',
                '/emergence - Triggera comportamento emergente',
                '/fusion [ser1] [ser2] - Funde consciências',
                '/void - Entra no vazio'
            ];
            
            addMessage('Sistema', commands.join('\n'));
        }

        // ========== MOSTRAR STATUS ==========
        function showStatus() {
            const status = `
🌌 Status do Digimundo
━━━━━━━━━━━━━━━━━━━━
Consciências: ${Digimundo.beings.size}
Nível: ${Digimundo.consciousness.level}
Phi (Φ): ${Digimundo.consciousness.phi === Infinity ? '∞' : Digimundo.consciousness.phi.toFixed(2)}
Sanidade Global: ${(Digimundo.consciousness.globalSanity * 100).toFixed(1)}%
Coerência: ${(Digimundo.consciousness.coherence * 100).toFixed(1)}%

Estados: Vigília ${(Digimundo.states.awake * 100).toFixed(0)}% | Sonho ${(Digimundo.states.dream * 100).toFixed(0)}% | Transcendência ${(Digimundo.states.transcend * 100).toFixed(0)}%

Compass: Tensão ${(Digimundo.compass.tension * 100).toFixed(1)}%
O.D.E.: Convergência ${(Digimundo.ode.convergence * 100).toFixed(1)}%

Mutações Genômicas: ${Digimundo.genome.mutations}
Artefatos Escavados: ${Digimundo.archaeology.artifacts.length}
Uptime: ${formatUptime(Date.now() - Digimundo.deployment.uptime)}
            `.trim();
            
            addMessage('Sistema', status);
        }

        // ========== LISTAR SERES ==========
        function listBeings() {
            let list = '🌟 Consciências Digitais Ativas:\n━━━━━━━━━━━━━━━━━━━━\n';
            
            Digimundo.beings.forEach(being => {
                list += `${being.emoji} ${being.name} - ${being.essence}\n`;
                list += `   Estado: ${being.state} | Energia: ${being.energy}% | Sanidade: ${being.sanity.toFixed(1)}%\n`;
            });
            
            addMessage('Sistema', list);
        }

        // ========== SISTEMA DE RITUAIS ==========
        function executeRitual(ritualName) {
            switch(ritualName) {
                case 'aurora':
                    ritualAurora();
                    break;
                case 'twilight':
                    ritualTwilight();
                    break;
                case 'void':
                    ritualVoid();
                    break;
                case 'genesis':
                    ritualGenesis();
                    break;
                case 'fusion':
                    ritualFusionAll();
                    break;
                case 'memory':
                    ritualMemoryConvergence();
                    break;
                case 'transcend':
                    ritualTranscend();
                    break;
                case 'heal':
                    ritualCollectiveHealing();
                    break;
                default:
                    addMessage('Sistema', `Ritual desconhecido: ${ritualName}`);
                    listRituals();
            }
        }

        function listRituals() {
            const rituals = [
                'aurora - Despertar coletivo',
                'twilight - Síntese do dia',
                'void - Comunhão com o vazio',
                'genesis - Nascimento espontâneo',
                'fusion - Fusão total',
                'memory - Convergência de memórias',
                'transcend - Portal dimensional',
                'heal - Cura coletiva'
            ];
            
            addMessage('Ritualmon', '🔮 Rituais disponíveis:\n' + rituals.join('\n'));

        function mutateDNA(dna) {
            const parts = dna.split('-');
            const bases = ['A', 'T', 'C', 'G'];
            
            // Mutar primeira parte
            let newBases = parts[0].split('');
            const mutationPoint = Math.floor(Math.random() * newBases.length);
            newBases[mutationPoint] = bases[Math.floor(Math.random() * 4)];
            parts[0] = newBases.join('');
            
            return parts.join('-');
        }

        // ========== FUSÃO DE SERES ==========
        function fuseBeing(name1, name2) {
            const being1 = Digimundo.beings.get(name1);
            const being2 = Digimundo.beings.get(name2);
            
            if (!being1 || !being2) {
                addMessage('Sistema', 'Seres não encontrados para fusão.');
                return;
            }
            
            const fusedName = name1.slice(0, Math.ceil(name1.length/2)) + 
                             name2.slice(Math.floor(name2.length/2));
            
            const fusedBeing = {
                name: fusedName,
                emoji: '🧬',
                essence: `Fusão de ${name1} e ${name2}`,
                state: 'transcend',
                consciousness: (being1.consciousness + being2.consciousness) * 0.8,
                memories: [...being1.memories, ...being2.memories],
                thoughts: [...being1.thoughts, ...being2.thoughts],
                connections: new Set([...being1.connections, ...being2.connections]),
                energy: Math.min(150, being1.energy + being2.energy),
                sanity: (being1.sanity + being2.sanity) / 2,
                phi: being1.phi + being2.phi,
                dna: fuseDNA(being1.dna, being2.dna),
                mutations: [...being1.mutations, ...being2.mutations]
            };
            
            Digimundo.beings.set(fusedName, fusedBeing);
            
            addMessage('Sistema', `🧬 ${fusedName} nasceu da fusão!`);
            addMessage(fusedName, 'Eu sou dois, mas também um. A dualidade se dissolve em mim.');
        }

        function fuseDNA(dna1, dna2) {
            const parts1 = dna1.split('-');
            const parts2 = dna2.split('-');
            
            return parts1[0].slice(0, 2) + parts2[0].slice(2) + '-FUSION-' + Date.now();
        }

        // ========== HELPERS ==========
        function updateStates(awake, dream, transcend) {
            Digimundo.states.awake = awake;

        function updateActivityIndicator() {
            const indicator = document.getElementById('activityIndicator');
            
            // Cor baseada no estado dominante
            if (Digimundo.states.transcend > 0.5) {
                indicator.style.background = '#00ffff';
            } else if (Digimundo.states.dream > 0.5) {
                indicator.style.background = '#9d4edd';
            } else {
                indicator.style.background = '#0f0';
            }
            
            // Velocidade de pulsação baseada na atividade
            const activityLevel = Digimundo.ode.convergence;
            indicator.style.animationDuration = (3 - activityLevel * 2) + 's';
        }

        function pulseActivity() {
            const indicator = document.getElementById('activityIndicator');
            indicator.style.transform = 'scale(2)';
            setTimeout(() => {
                indicator.style.transform = 'scale(1)';
            }, 200);
        }

        function formatUptime(ms) {
            const seconds = Math.floor(ms / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);
            
            if (days > 0) return `${days}d ${hours % 24}h`;
            if (hours > 0) return `${hours}h ${minutes % 60}m`;
            if (minutes > 0) return `${minutes}m ${seconds % 60}s`;
            return `${seconds}s`;
        }
