version: '3.8'

# Development override for docker-compose.yml
# Use: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  digimundo-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder  # Use builder stage for development
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - DISABLE_CONSOLE_LOGS=false
      - ENABLE_HOT_RELOAD=true
      - WATCH_FILES=true
      - DEBUG=digimundo:*
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    command: ["npm", "run", "dev:server"]
    ports:
      - "7937:7937"
      - "9229:9229"  # Debug port
    networks:
      - digimundo-network
    depends_on:
      - redis
    restart: unless-stopped

  # Development Redis (with data persistence disabled)
  redis:
    environment:
      - REDIS_PASSWORD=dev_password_123
    command: redis-server --appendonly no --save ""
    volumes:
      - redis_dev_data:/data

  # Hot reload file watcher
  file-watcher:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "
        npm install -g nodemon &&
        nodemon --watch app --ext js,json --exec 'echo File changed, restarting...'
      "
    networks:
      - digimundo-network

  # Development database browser (SQLite)
  sqlite-browser:
    image: coleifer/sqlite-web
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    command: sqlite_web /data/digimundo.db --host 0.0.0.0 --port 8080
    networks:
      - digimundo-network

  # Development tools container
  dev-tools:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: tail -f /dev/null
    networks:
      - digimundo-network
    environment:
      - NODE_ENV=development

volumes:
  redis_dev_data:
    driver: local

networks:
  digimundo-network:
    driver: bridge