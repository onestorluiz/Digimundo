<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portal do Digimundo</title>
</head>
<body>
    <h1>Bem-vindo ao Digimundo</h1>
    <p>Use seu login para acessar seu Digimon ou explorar os mundos ativos.</p>
    <form action="/login" method="post">
        <input type="text" name="username" placeholder="Digite seu nome">
        <input type="password" name="password" placeholder="Senha">
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
