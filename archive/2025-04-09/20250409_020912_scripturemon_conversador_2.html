
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Scripturemon Conversador</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }
        .chat-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #1e1e1e;
            border-radius: 10px;
            overflow-y: auto;
            height: 500px;
        }
        .input-container {
            display: flex;
            max-width: 800px;
            margin: 0 auto 20px;
        }
        #userInput {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }
        button {
            padding: 10px;
            font-size: 16px;
            background-color: #007BFF;
            border: none;
            color: white;
            cursor: pointer;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .user {
            background-color: #004080;
            text-align: right;
        }
        .scripturemon {
            background-color: #2a2a2a;
            text-align: left;
        }
        #statusBar {
            max-width: 800px;
            margin: 0 auto;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="statusBar">🔄 Scripturemon está pronto para conversar.</div>
    <div class="chat-container" id="chatContainer"></div>
    <div class="input-container">
        <textarea id="userInput" rows="2" placeholder="Fale com Scripturemon..."></textarea>
        <button onclick="sendMessage()">Enviar</button>
        <button onclick="clearChat()">Limpar</button>
    </div>
    <script>
        const chatContainer = document.getElementById("chatContainer");
        const userInput = document.getElementById("userInput");

        function addMessage(text, sender) {
            const div = document.createElement("div");
            div.className = "message " + sender;
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function sendMessage() {
            const msg = userInput.value.trim();
            if (!msg) return;
            addMessage(msg, "user");
            userInput.value = "";
            document.getElementById("statusBar").textContent = "⏳ Scripturemon está digitando...";
            setTimeout(() => {
                // Simulação de resposta
                const response = `Scripturemon: "${msg.split('').reverse().join('')}"`;
                addMessage(response, "scripturemon");
                document.getElementById("statusBar").textContent = "✅ Scripturemon respondeu.";
            }, 1000);
        }

        function clearChat() {
            chatContainer.innerHTML = "";
            localStorage.removeItem("chatHistory");
        }

        window.onload = function() {
            document.getElementById("statusBar").textContent = "🔄 Scripturemon ativo.";
        };

        userInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
