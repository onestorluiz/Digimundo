<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineProd v1.0 - Sistema de Gestão Cinematográfica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Bibliotecas Externas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        /* ==================== DIGIMON WORLD 3 THEME ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Digimon Colors */
            --bg-dark: #0a1428;
            --bg-darker: #05070f;
            --neon-blue: #4a9fff;
            --neon-blue-dark: #3a7fcf;
            --text-yellow: #ffdd00;
            --text-cyan: #00ddff;
            --text-white: #e8f4ff;
            --text-gray: #7a9cc6;
            --window-bg: rgba(10, 30, 60, 0.85);
            --window-border: #3a7fcf;
            --stat-red: #ff4757;
            --stat-blue: #3742fa;
            --stat-gold: #ffa502;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;

            /* Grid */
            --grid-color: rgba(74, 159, 255, 0.15);
            --grid-size: 30px;
        }

        @keyframes grid-scroll {
            0% { background-position: 0 0; }
            100% { background-position: var(--grid-size) var(--grid-size); }
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0; }
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 1.5px var(--neon-blue)); }
            50% { filter: drop-shadow(0 0 4px var(--neon-blue)); }
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(400px);
                opacity: 0;
            }
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background: var(--bg-dark);
            color: var(--text-white);
            line-height: 1.8;
            font-size: 8px;
            overflow-x: hidden;
        }

        /* Grid Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(0deg, transparent 24%, var(--grid-color) 25%, var(--grid-color) 26%, transparent 27%, transparent 74%, var(--grid-color) 75%, var(--grid-color) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, var(--grid-color) 25%, var(--grid-color) 26%, transparent 27%, transparent 74%, var(--grid-color) 75%, var(--grid-color) 76%, transparent 77%, transparent);
            background-size: var(--grid-size) var(--grid-size);
            animation: grid-scroll 8s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        /* Scanlines */
        body::after {
            content: '';
            position: fixed;
            top: -100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.1) 2px,
                rgba(0, 0, 0, 0.1) 4px
            );
            animation: scanline 8s linear infinite;
            pointer-events: none;
            z-index: 2;
        }

        .hidden { display: none !important; }

        /* ==================== WINDOW COMPONENT ==================== */
        .window {
            background: var(--window-bg);
            border: 3px solid var(--window-border);
            border-radius: 8px;
            position: relative;
            backdrop-filter: blur(5px);
            box-shadow:
                0 0 10px rgba(74, 159, 255, 0.3),
                inset 0 0 10px rgba(74, 159, 255, 0.1);
        }

        .window::before,
        .window::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            border: 2px solid var(--neon-blue);
        }

        .window::before {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
        }

        .window::after {
            bottom: -2px;
            right: -2px;
            border-left: none;
            border-top: none;
        }

        .window-title {
            font-size: 10px;
            color: var(--text-yellow);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 0 2px rgba(255, 221, 0, 0.5);
        }

        /* ==================== LOGIN PAGE ==================== */
        #loginPage {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .login-container {
            width: 100%;
            max-width: 500px;
        }

        .login-window {
            padding: 30px;
        }

        .logo-retro {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--neon-blue) 0%, var(--text-cyan) 100%);
            border: 3px solid var(--text-yellow);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            animation: glow 2s ease-in-out infinite;
        }

        .system-title {
            text-align: center;
            font-size: 14px;
            color: var(--text-cyan);
            margin-bottom: 8px;
            text-shadow: 0 0 2px rgba(0, 221, 255, 0.5);
        }

        .system-subtitle {
            text-align: center;
            font-size: 7px;
            color: var(--text-gray);
            margin-bottom: 30px;
        }

        /* ==================== FORMS ==================== */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 8px;
            color: var(--text-cyan);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: rgba(0, 20, 40, 0.6);
            border: 2px solid var(--neon-blue-dark);
            border-radius: 4px;
            color: var(--text-white);
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            transition: all 0.3s;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 7.5px rgba(74, 159, 255, 0.5);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            line-height: 1.6;
        }

        /* ==================== BUTTONS ==================== */
        .btn {
            padding: 12px 20px;
            background: var(--neon-blue);
            color: var(--text-white);
            border: 2px solid var(--neon-blue-dark);
            border-radius: 4px;
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 4px 0 var(--neon-blue-dark);
            position: relative;
            top: 0;
        }

        .btn:hover {
            background: var(--text-cyan);
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px var(--text-cyan);
            top: 2px;
        }

        .btn:active {
            top: 4px;
            box-shadow: 0 0 5px var(--text-cyan);
        }

        .btn-success {
            background: var(--success);
            border-color: #059669;
            box-shadow: 0 4px 0 #059669;
        }

        .btn-success:hover {
            background: #10b981;
            box-shadow: 0 0 10px var(--success);
        }

        .btn-danger {
            background: var(--danger);
            border-color: #dc2626;
            box-shadow: 0 4px 0 #dc2626;
        }

        .btn-danger:hover {
            background: #ef4444;
            box-shadow: 0 0 10px var(--danger);
        }

        .btn-secondary {
            background: var(--text-gray);
            border-color: #5a7c9e;
            box-shadow: 0 4px 0 #5a7c9e;
        }

        .btn-secondary:hover {
            background: #8aacce;
            box-shadow: 0 0 10px var(--text-gray);
        }

        .btn-sm {
            padding: 8px 12px;
            font-size: 7px;
            box-shadow: 0 2px 0 var(--neon-blue-dark);
        }

        .w-full { width: 100%; }

        /* ==================== MAIN APP ==================== */
        #mainApp {
            display: flex;
            min-height: 100vh;
            position: relative;
            z-index: 10;
        }

        /* ==================== SIDEBAR ==================== */
        .sidebar {
            width: 280px;
            background: rgba(5, 15, 30, 0.95);
            border-right: 3px solid var(--window-border);
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 1000;
            overflow-y: auto;
            box-shadow: 0 0 15px rgba(74, 159, 255, 0.3);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 2px solid var(--window-border);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .sidebar-logo {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--neon-blue) 0%, var(--text-cyan) 100%);
            border: 2px solid var(--text-yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            animation: glow 2s ease-in-out infinite;
        }

        .sidebar-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            color: var(--text-cyan);
            text-shadow: 0 0 2px rgba(0, 221, 255, 0.5);
            letter-spacing: 2px;
        }

        .menu-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            margin: 5px 0;
            background: transparent;
            border: 2px solid transparent;
            border-radius: 4px;
            color: var(--text-gray);
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            text-align: left;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .menu-item:hover {
            background: rgba(74, 159, 255, 0.1);
            border-color: var(--neon-blue);
            color: var(--text-cyan);
            box-shadow: 0 0 7.5px rgba(74, 159, 255, 0.3);
        }

        .menu-item.active {
            background: rgba(74, 159, 255, 0.2);
            border-color: var(--neon-blue);
            color: var(--text-yellow);
            box-shadow: 0 0 10px rgba(74, 159, 255, 0.5);
        }

        .menu-icon {
            font-size: 16px;
            filter: drop-shadow(0 0 1.5px currentColor);
        }

        /* ==================== HEADER ==================== */
        .header {
            position: fixed;
            top: 0;
            left: 280px;
            right: 0;
            height: 80px;
            background: rgba(5, 15, 30, 0.95);
            border-bottom: 3px solid var(--window-border);
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 999;
            box-shadow: 0 0 15px rgba(74, 159, 255, 0.3);
        }

        .search-container {
            flex: 1;
            max-width: 500px;
        }

        .search-container input {
            width: 100%;
            background: rgba(0, 20, 40, 0.6);
        }

        /* ==================== MAIN CONTENT ==================== */
        .main-content {
            margin-left: 280px;
            margin-top: 80px;
            min-height: calc(100vh - 80px);
            padding: 30px;
        }

        /* ==================== CARDS ==================== */
        .card {
            padding: 25px;
            margin-bottom: 25px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--neon-blue-dark);
        }

        .card-title {
            font-size: 12px;
            color: var(--text-yellow);
            text-transform: uppercase;
            text-shadow: 0 0 2px rgba(255, 221, 0, 0.5);
        }

        /* ==================== STATS ==================== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            padding: 20px;
            text-align: center;
        }

        .stat-label {
            font-size: 7px;
            color: var(--text-cyan);
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 0 0 1px rgba(0, 221, 255, 0.3);
        }

        .stat-value {
            font-size: 28px;
            color: var(--text-yellow);
            text-shadow: 0 0 3px rgba(255, 221, 0, 0.6);
        }

        /* ==================== TABLE ==================== */
        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: rgba(74, 159, 255, 0.1);
            padding: 15px;
            text-align: left;
            font-size: 7px;
            color: var(--text-cyan);
            text-transform: uppercase;
            border-bottom: 2px solid var(--neon-blue);
        }

        tbody td {
            padding: 15px;
            border-bottom: 1px solid rgba(74, 159, 255, 0.2);
            font-size: 7px;
            color: var(--text-white);
        }

        tbody tr:hover {
            background: rgba(74, 159, 255, 0.1);
        }

        /* ==================== MODAL ==================== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            width: 90%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 20px 25px;
            border-bottom: 2px solid var(--neon-blue-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 10px;
            color: var(--text-yellow);
            text-shadow: 0 0 2px rgba(255, 221, 0, 0.5);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-cyan);
            font-size: 24px;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            transition: all 0.3s;
        }

        .modal-close:hover {
            color: var(--text-yellow);
            text-shadow: 0 0 3px rgba(255, 221, 0, 0.6);
        }

        .modal-body {
            padding: 25px;
        }

        .modal-footer {
            padding: 20px 25px;
            border-top: 2px solid var(--neon-blue-dark);
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        /* ==================== BADGES ==================== */
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 7px;
            font-weight: normal;
            border: 2px solid;
            text-transform: uppercase;
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border-color: var(--success);
        }

        .badge-warning {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border-color: var(--warning);
        }

        .badge-danger {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border-color: var(--danger);
        }

        .badge-info {
            background: rgba(0, 221, 255, 0.2);
            color: var(--text-cyan);
            border-color: var(--text-cyan);
        }

        /* ==================== ACTIONS ==================== */
        .action-buttons {
            display: flex;
            gap: 10px;
        }

        /* ==================== GRID ==================== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .grid-item {
            padding: 20px;
        }

        .grid-item-title {
            font-size: 9px;
            color: var(--text-cyan);
            margin-bottom: 15px;
            text-shadow: 0 0 1px rgba(0, 221, 255, 0.3);
        }

        .grid-item-content {
            font-size: 7px;
            color: var(--text-gray);
            line-height: 1.6;
        }

        /* ==================== SEARCH BAR ==================== */
        .search-bar {
            position: relative;
            margin-bottom: 20px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-cyan);
            font-size: 12px;
        }

        .search-bar input {
            padding-left: 40px;
        }

        /* ==================== INFO BOX ==================== */
        .info-box {
            background: rgba(74, 159, 255, 0.1);
            border: 2px solid var(--neon-blue);
            border-radius: 4px;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
        }

        .info-box small {
            font-size: 7px;
            color: var(--text-gray);
        }

        /* ==================== PROJECT LIST ==================== */
        .project-item {
            padding: 15px 0;
            border-bottom: 1px solid rgba(74, 159, 255, 0.2);
        }

        .project-item:last-child {
            border-bottom: none;
        }

        .project-name {
            font-size: 8px;
            color: var(--text-cyan);
            margin-bottom: 5px;
            text-shadow: 0 0 1px rgba(0, 221, 255, 0.3);
        }

        .project-meta {
            font-size: 6px;
            color: var(--text-gray);
        }

        /* ==================== SCROLLBAR ==================== */
        ::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-darker);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--neon-blue-dark);
            border: 2px solid var(--bg-darker);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--neon-blue);
        }

        /* ==================== UPLOAD AREA ==================== */
        .upload-area {
            border: 3px dashed var(--neon-blue-dark);
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            background: rgba(0, 20, 40, 0.3);
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: var(--neon-blue);
            background: rgba(74, 159, 255, 0.1);
        }

        .upload-area.dragover {
            border-color: var(--text-cyan);
            background: rgba(0, 221, 255, 0.2);
            transform: scale(1.02);
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(0, 20, 40, 0.3);
            border: 2px solid var(--neon-blue-dark);
            border-radius: 4px;
            transition: all 0.3s;
        }

        .file-item:hover {
            border-color: var(--neon-blue);
            background: rgba(74, 159, 255, 0.1);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .file-icon {
            font-size: 24px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        /* ==================== CALENDAR ==================== */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0, 20, 40, 0.3);
            border: 2px solid var(--neon-blue-dark);
            border-radius: 4px;
        }

        .calendar-month {
            font-size: 12px;
            color: var(--text-yellow);
            text-transform: uppercase;
        }

        .calendar-nav {
            display: flex;
            gap: 10px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .calendar-day-header {
            padding: 10px;
            text-align: center;
            font-size: 7px;
            color: var(--text-cyan);
            text-transform: uppercase;
            background: rgba(0, 20, 40, 0.3);
            border: 2px solid var(--neon-blue-dark);
            border-radius: 4px;
        }

        .calendar-day {
            padding: 10px;
            min-height: 60px;
            text-align: center;
            font-size: 8px;
            background: rgba(0, 20, 40, 0.2);
            border: 2px solid var(--neon-blue-dark);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .calendar-day:hover {
            border-color: var(--neon-blue);
            background: rgba(74, 159, 255, 0.1);
            transform: scale(1.05);
        }

        .calendar-day.empty {
            background: transparent;
            border-color: transparent;
            cursor: default;
        }

        .calendar-day.empty:hover {
            transform: none;
        }

        .calendar-day.today {
            border-color: var(--text-yellow);
            background: rgba(255, 221, 0, 0.1);
        }

        .calendar-day-number {
            color: var(--text-white);
            margin-bottom: 5px;
        }

        .calendar-day.today .calendar-day-number {
            color: var(--text-yellow);
            font-weight: bold;
        }

        .event-dot {
            width: 6px;
            height: 6px;
            background: var(--neon-blue);
            border-radius: 50%;
            display: inline-block;
            margin: 2px;
        }

        .event-list {
            margin-top: 20px;
        }

        .event-item {
            padding: 15px;
            background: rgba(0, 20, 40, 0.3);
            border: 2px solid var(--neon-blue-dark);
            border-radius: 4px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .event-item:hover {
            border-color: var(--neon-blue);
            background: rgba(74, 159, 255, 0.1);
        }

        .event-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .event-title {
            font-size: 9px;
            color: var(--text-cyan);

    </style>
</head>
<body>

    <div id="loginPage">

    <script>
        // ==================== ESTADO DA APLICAÇÃO ====================

            currentUser: null,

            projects: [],

        // ==================== INICIALIZAÇÃO ====================
        document.addEventListener('DOMContentLoaded', function() {
            loadFromLocalStorage();

            // Dados de exemplo se não houver dados salvos
            if (appState.projects.length === 0) {
                initializeSampleData();
            }

        function setupEventListeners() {
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (email === 'admin@cinepro.com' && password === 'admin123') {
                appState.currentUser = { name: 'Admin', email: email };
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                loadModule('dashboard');
            } else {
                alert('Credenciais inválidas!');
            }
        }

        function logout() {
            saveToLocalStorage();
            location.reload();
        }

        // ==================== ARMAZENAMENTO LOCAL ====================
        function saveToLocalStorage() {
            localStorage.setItem('cineproData', JSON.stringify(appState));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('cineproData');
            if (saved) {
                const data = JSON.parse(saved);
                Object.assign(appState, data);
            }
        }

        // ==================== FUNÇÕES UTILITÁRIAS ====================
        function generateId(prefix) {
            return `${prefix}_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
        }

        function formatCurrency(value) {
            if (!value && value !== 0) return 'R$ 0,00';
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(value);
        }

        function formatDate(date) {
            if (!date) return '';
            return new Date(date).toLocaleDateString('pt-BR');
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function getFileIcon(type) {
            if (!type) return '📎';
            if (type.includes('pdf')) return '📄';
            if (type.includes('image')) return '🖼️';
            if (type.includes('video')) return '🎥';
            if (type.includes('audio')) return '🎵';
            if (type.includes('text')) return '📝';
            if (type.includes('spreadsheet') || type.includes('excel')) return '📊';
            if (type.includes('presentation') || type.includes('powerpoint')) return '📽️';
            if (type.includes('word')) return '📃';
            return '📎';
        }

        // ==================== SISTEMA DE NOTIFICAÇÕES ====================
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = 'notification window';

            // Cores por tipo
            const colors = {
                success: { bg: 'rgba(16, 185, 129, 0.2)', border: '#10b981', icon: '✅' },
                error: { bg: 'rgba(239, 68, 68, 0.2)', border: '#ef4444', icon: '❌' },
                warning: { bg: 'rgba(245, 158, 11, 0.2)', border: '#f59e0b', icon: '⚠️' },
                info: { bg: 'rgba(74, 159, 255, 0.2)', border: '#4a9fff', icon: 'ℹ️' }
            };

            const color = colors[type] || colors.info;

            notification.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: ${color.bg};
                border-color: ${color.border};
                padding: 15px 20px;
                z-index: 10000;
                animation: slideIn 0.3s ease-out;
                display: flex;
                align-items: center;
                gap: 12px;
                min-width: 250px;
                max-width: 400px;
            `;

            notification.innerHTML = `
                <span style="font-size: 16px;">${color.icon}</span>
                <span style="font-size: 7px; color: var(--text-white); line-height: 1.4;">${message}</span>
            `;

            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease-out';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // ==================== DADOS DE EXEMPLO ====================

        // ==================== RENDERIZAÇÃO DO MENU ====================
        function renderSidebarMenu() {
            const menuContainer = document.getElementById('sidebarMenu');
            menuContainer.innerHTML = '';

            menuItems.forEach(item => {
                const button = document.createElement('button');
                button.className = `menu-item ${appState.activeModule === item.id ? 'active' : ''}`;
                button.onclick = () => loadModule(item.id);
                button.innerHTML = `
                    <span class="menu-icon">${item.icon}</span>
                    <span>${item.label}</span>
                `;
                menuContainer.appendChild(button);
            });
        }

        // ==================== CARREGAMENTO DE MÓDULOS ====================
        function loadModule(moduleId) {
            appState.activeModule = moduleId;
            renderSidebarMenu();

            const contentArea = document.getElementById('contentArea');

            switch(moduleId) {
                case 'dashboard':
                    loadDashboard();
                    break;
                case 'projects':
                    loadProjects();
                    break;
                case 'crew':
                    loadCrew();
                    break;
                case 'equipment':
                    loadEquipment();
                    break;
                case 'locations':
                    loadLocations();
                    break;
                case 'callSheets':
                    loadCallSheets();
                    break;
                case 'scripts':
                    loadScripts();
                    break;
                case 'schedule':
                    loadSchedule();
                    break;
                case 'budget':
                    loadBudget();
                    break;
                case 'documents':
                    loadDocuments();
                    break;
                case 'reports':
                    loadReports();
                    break;
                default:
                    contentArea.innerHTML = '<div class="card window"><h2>Módulo em desenvolvimento</h2></div>';
            }

        // ==================== DASHBOARD ====================
        function loadDashboard() {
            const content = document.getElementById('contentArea');

            // Calcular total do orçamento
            const totalBudget = appState.budget.reduce((sum, item) => {
                const total = (parseFloat(item.quantity) || 0) * (parseFloat(item.unitPrice) || 0);
                return sum + total;
            }, 0);

            content.innerHTML = `
                <h1 class="window-title" style="font-size: 16px; margin-bottom: 30px;">DASHBOARD</h1>

                <div class="stats-grid">
                    <div class="window stat-card">
                        <h3 class="stat-label">Projetos Ativos</h3>
                        <p class="stat-value">${appState.projects.length}</p>
                    </div>
                    <div class="window stat-card">
                        <h3 class="stat-label">Equipe Total</h3>
                        <p class="stat-value">${appState.crew.length}</p>

                    <div class="window stat-card">
                        <h3 class="stat-label">Equipamentos</h3>
                        <p class="stat-value">${appState.equipment.length}</p>
                    </div>
                    <div class="window stat-card">
                        <h3 class="stat-label">Locacoes</h3>
                        <p class="stat-value">${appState.locations.length}</p>
                    </div>
                    <div class="window stat-card">
                        <h3 class="stat-label">Roteiros</h3>
                        <p class="stat-value">${appState.scripts.length}</p>
                    </div>
                    <div class="window stat-card">
                        <h3 class="stat-label">Call Sheets</h3>
                        <p class="stat-value">${appState.callSheets.length}</p>
                    </div>
                    <div class="window stat-card">
                        <h3 class="stat-label">Documentos</h3>
                        <p class="stat-value">${appState.documents.length}</p>
                    </div>
                    <div class="window stat-card">
                        <h3 class="stat-label">Orcamento Total</h3>
                        <p class="stat-value" style="font-size: 16px;">${formatCurrency(totalBudget)}</p>
                    </div>
                </div>

                <div class="grid">
                    <div class="window grid-item">
                        <h3 class="grid-item-title">Projetos Recentes</h3>
                        ${appState.projects.length === 0 ? `
                            <p style="font-size: 7px; color: var(--text-gray); padding: 10px;">Nenhum projeto cadastrado</p>

                    <div class="window grid-item">

                            <p style="font-size: 7px; color: var(--text-gray); padding: 10px;">Nenhum membro cadastrado</p>
                        ` : appState.crew.slice(0, 3).map(c => `
                            <div class="project-item">
                                <div class="project-name">${c.name}</div>
                                <div class="project-meta">${c.role} • ${c.department}</div>
                            </div>

                    </div>

                    <div class="window grid-item">

        // ==================== PROJETOS ====================
        function loadProjects() {
            renderList('projects', 'Projetos', [
                { key: 'name', label: 'Nome' },
                { key: 'type', label: 'Tipo' },
                { key: 'status', label: 'Status' },
                { key: 'director', label: 'Diretor' },
                { key: 'budget', label: 'Orcamento', format: 'currency' }
            ]);
        }

        function editProject(id) {
            const project = id ? appState.projects.find(p => p.id === id) : {};

            openModal(`${id ? 'Editar' : 'Novo'} Projeto`, `
                <form id="projectForm">
                    <div class="form-group">
                        <label>Nome do Projeto *</label>
                        <input type="text" name="name" value="${project.name || ''}" required>
                    </div>
                    <div class="form-group">
                        <label>Tipo</label>
                        <select name="type">
                            <option value="Longa-metragem" ${project.type === 'Longa-metragem' ? 'selected' : ''}>Longa-metragem</option>
                            <option value="Curta-metragem" ${project.type === 'Curta-metragem' ? 'selected' : ''}>Curta-metragem</option>
                            <option value="Série TV" ${project.type === 'Série TV' ? 'selected' : ''}>Série TV</option>
                            <option value="Comercial" ${project.type === 'Comercial' ? 'selected' : ''}>Comercial</option>
                            <option value="Documentário" ${project.type === 'Documentário' ? 'selected' : ''}>Documentário</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select name="status">
                            <option value="Desenvolvimento" ${project.status === 'Desenvolvimento' ? 'selected' : ''}>Desenvolvimento</option>
                            <option value="Pré-Produção" ${project.status === 'Pré-Produção' ? 'selected' : ''}>Pré-Produção</option>
                            <option value="Em Produção" ${project.status === 'Em Produção' ? 'selected' : ''}>Em Produção</option>
                            <option value="Pós-Produção" ${project.status === 'Pós-Produção' ? 'selected' : ''}>Pós-Produção</option>
                            <option value="Concluído" ${project.status === 'Concluído' ? 'selected' : ''}>Concluído</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Diretor</label>
                        <input type="text" name="director" value="${project.director || ''}">
                    </div>
                    <div class="form-group">
                        <label>Produtor</label>
                        <input type="text" name="producer" value="${project.producer || ''}">
                    </div>
                    <div class="form-group">
                        <label>Orcamento (R$)</label>
                        <input type="number" name="budget" value="${project.budget || ''}">
                    </div>
                    <div class="form-group">
                        <label>Data de Inicio</label>
                        <input type="date" name="startDate" value="${project.startDate || ''}">
                    </div>
                    <div class="form-group">
                        <label>Data de Termino</label>
                        <input type="date" name="endDate" value="${project.endDate || ''}">
                    </div>
                    <div class="form-group">
                        <label>Descricao</label>
                        <textarea name="description">${project.description || ''}</textarea>
                    </div>
                </form>
            `, [
                { text: 'Cancelar', onclick: 'closeModal()', class: 'btn-secondary' },
                { text: 'Salvar', onclick: `saveProject('${id || ''}')`, class: 'btn-success' }
            ]);
        }

        function saveProject(id) {
            // Validate required fields
            if (!validateForm('projectForm', [
                { name: 'name', label: 'Nome' },
                { name: 'type', label: 'Tipo' },
                { name: 'status', label: 'Status' }
            ])) {
                return;
            }

            const form = document.getElementById('projectForm');
            const formData = new FormData(form);

            const project = {

        // ==================== CRONOGRAMA/CALENDÁRIO ====================
        let currentMonth = new Date().getMonth();

        function loadSchedule() {

        function renderCalendar(container) {
            const monthNames = ['Janeiro', 'Fevereiro', 'Marco', 'Abril', 'Maio', 'Junho',
                               'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
            const dayNames = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sab'];

            const days = generateCalendarDays(currentYear, currentMonth);
            const upcomingEvents = appState.schedule
                .filter(e => new Date(e.date) >= new Date())
                .sort((a, b) => new Date(a.date) - new Date(b.date))
                .slice(0, 5);

            container.innerHTML = `
                <div class="window card">
                    <div class="card-header">
                        <h2 class="card-title">Cronograma</h2>
                        <button class="btn btn-success" onclick="addScheduleEvent()">
                            + Novo Evento
                        </button>
                    </div>

                    <div class="calendar-header">
                        <div class="calendar-month">${monthNames[currentMonth]} ${currentYear}</div>
                        <div class="calendar-nav">
                            <button class="btn btn-sm" onclick="changeMonth(-1)">◀</button>
                            <button class="btn btn-sm" onclick="changeMonth(1)">▶</button>
                            <button class="btn btn-sm btn-secondary" onclick="currentMonth = new Date().getMonth(); currentYear = new Date().getFullYear(); renderCalendar(document.getElementById('contentArea'))">Hoje</button>
                        </div>
                    </div>

                    <div class="calendar-grid">
                        ${dayNames.map(day => `
                            <div class="calendar-day-header">${day}</div>
                        `).join('')}
                        ${days.map(day => {
                            if (day === null) {
                                return '<div class="calendar-day empty"></div>';
                            }

                            const isToday = isDateToday(currentYear, currentMonth, day);
                            const events = getEventsForDay(currentYear, currentMonth, day);

                            return `
                                <div class="calendar-day ${isToday ? 'today' : ''}" onclick="showDayEvents(${currentYear}, ${currentMonth}, ${day})">
                                    <div class="calendar-day-number">${day}</div>
                                    ${events.length > 0 ? `
                                        <div>
                                            ${events.slice(0, 3).map(() => '<span class="event-dot"></span>').join('')}
                                            ${events.length > 3 ? '<div style="font-size: 6px; color: var(--text-cyan);">+' + (events.length - 3) + '</div>' : ''}
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="event-list">
                        <h3 style="font-size: 10px; color: var(--text-yellow); margin-bottom: 15px;">Proximos Eventos</h3>
                        ${upcomingEvents.length === 0 ? `
                            <p style="font-size: 7px; color: var(--text-gray); text-align: center; padding: 20px;">Nenhum evento agendado</p>
                        ` : upcomingEvents.map(event => `
                            <div class="event-item">
                                <div class="event-item-header">
                                    <div class="event-title">${event.title}</div>
                                    <div class="btn-group">
                                        <button class="btn btn-sm" onclick="viewEvent('${event.id}')">👁️</button>
                                        <button class="btn btn-sm btn-danger" onclick="deleteEvent('${event.id}')">🗑️</button>
                                    </div>
                                </div>
                                <div class="event-meta">
                                    ${formatDate(event.date)} ${event.time ? '• ' + event.time : ''}
                                    ${event.type ? '• ' + event.type : ''}
                                    ${event.project ? '• ' + event.project : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar(document.getElementById('contentArea'));
        }

        function generateCalendarDays(year, month) {
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const days = [];

            // Adiciona dias vazios antes do primeiro dia do mês
            for (let i = 0; i < firstDay; i++) {
                days.push(null);
            }

            // Adiciona os dias do mês
            for (let day = 1; day <= daysInMonth; day++) {
                days.push(day);
            }

            return days;
        }

        function isDateToday(year, month, day) {
            const today = new Date();
            return today.getFullYear() === year &&
                   today.getMonth() === month &&
                   today.getDate() === day;
        }

        function getEventsForDay(year, month, day) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            return appState.schedule.filter(event => event.date === dateStr);
        }

        function showDayEvents(year, month, day) {
            const events = getEventsForDay(year, month, day);
            const monthNames = ['Janeiro', 'Fevereiro', 'Marco', 'Abril', 'Maio', 'Junho',
                               'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

            if (events.length === 0) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                // Criar evento direto para este dia
                addScheduleEvent(dateStr);
            } else {
                openModal(`Eventos - ${day} de ${monthNames[month]} ${year}`, `
                    <div style="font-size: 7px;">
                        ${events.map(event => `

                                <div class="event-item-header">
                                    <div class="event-title">${event.title}</div>
                                    <div class="btn-group">

                                <div class="event-meta">
                                    ${event.time || ''} ${event.type ? '• ' + event.type : ''}
                                </div>
                                ${event.description ? `<p style="margin-top: 10px;">${event.description}</p>` : ''}
                            </div>
                        `).join('')}
                    </div>
                `, [
                    { text: 'Fechar', onclick: 'closeModal()', class: 'btn-secondary' }
                ]);
            }
        }

        function handleDrop(e) {

            document.getElementById('uploadArea').classList.remove('dragover');

            e.preventDefault();

            document.getElementById('uploadArea').classList.add('dragover');

            e.preventDefault();
            e.stopPropagation();
            const uploadArea = document.getElementById('uploadArea');
            if (uploadArea && !uploadArea.contains(e.relatedTarget)) {
                uploadArea.classList.remove('dragover');

            for (let file of files) {

                    name: file.name,
                    type: file.type || 'application/octet-stream',
                    size: formatFileSize(file.size),
                    uploadedAt: new Date().toISOString(),
                    data: null // Em produção, seria enviado para servidor
                };

                appState.documents.push(doc);

            saveToLocalStorage();
            loadDocuments();
            showNotification(`${files.length} arquivo(s) enviado(s) com sucesso!`, 'success');

            if (data.length === 0) {
                html += `
                    <tr>
                        <td colspan="${columns.length + 1}" style="text-align: center; padding: 40px; color: var(--text-gray);">
                            Nenhum registro encontrado
                        </td>
                    </tr>
                `;
            } else {
                data.forEach(item => {
                    html += '<tr>';
                    columns.forEach(col => {
                        let value = item[col.key] || '-';
                        if (col.format === 'currency' && value !== '-') {
                            value = `R$ ${parseFloat(value).toLocaleString('pt-BR')}`;
                        }
                        if (col.key === 'status') {
                            const badgeClass = value === 'Ativo' || value === 'Disponível' || value === 'Em Produção' ? 'badge-success' :
                                              value === 'Inativo' || value === 'Indisponível' || value === 'Concluído' ? 'badge-danger' :
                                              'badge-warning';
                            value = `<span class="badge ${badgeClass}">${value}</span>`;
                        }
                        html += `<td>${value}</td>`;
                    });

                    const editFunction = `edit${module.charAt(0).toUpperCase() + module.slice(1).replace(/s$/, '')}`;
                    const deleteFunction = `delete${module.charAt(0).toUpperCase() + module.slice(1).replace(/s$/, '')}`;

                    html += `
                        <td>
                            <div class="action-buttons">
                                <button class="btn btn-sm" onclick="${editFunction}('${item.id}')">✏️</button>
                                <button class="btn btn-sm btn-danger" onclick="${deleteFunction}('${item.id}')">🗑️</button>
                            </div>
                        </td>
                    `;
                    html += '</tr>';
                });
            }

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            content.innerHTML = html;
        }

        function filterTable(tableId, searchTerm) {
            const table = document.getElementById(`${tableId}Table`);
            const rows = table.getElementsByTagName('tbody')[0].getElementsByTagName('tr');

                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(searchTerm.toLowerCase()) ? '' : 'none';
            }
        }

        // ==================== VALIDATION & UTILITIES ====================
        function validateForm(formId, requiredFields) {
            const form = document.getElementById(formId);
            if (!form) return false;

            for (let field of requiredFields) {
                const input = form.querySelector(`[name="${field.name}"]`);
                if (!input || !input.value || input.value.trim() === '') {
                    showNotification(`Campo "${field.label}" e obrigatorio!`, 'warning');
                    input.focus();
                    return false;
                }

                // Validate number fields
                if (field.type === 'number' && input.value) {
                    const num = parseFloat(input.value);
                    if (isNaN(num) || num < 0) {
                        showNotification(`Campo "${field.label}" deve ser um numero valido!`, 'warning');
                        input.focus();
                        return false;
                    }
                }

                // Validate email fields
                if (field.type === 'email' && input.value) {
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(input.value)) {
                        showNotification(`Campo "${field.label}" deve ser um email valido!`, 'warning');
                        input.focus();
                        return false;
                    }
                }

                // Validate date fields
                if (field.type === 'date' && input.value) {
                    const date = new Date(input.value);
                    if (isNaN(date.getTime())) {
                        showNotification(`Campo "${field.label}" deve ser uma data valida!`, 'warning');
                        input.focus();
                        return false;
                    }
                }
            }

            return true;
        }

                    'Descricao': p.description || ''
                }));
                const ws1 = XLSX.utils.json_to_sheet(projectsData);
                XLSX.utils.book_append_sheet(wb, ws1, "Projetos");
            }

            // Crew Sheet
            if (appState.crew.length > 0) {
                const crewData = appState.crew.map(c => ({
                    'Nome': c.name || '',
                    'Funcao': c.role || '',
                    'Departamento': c.department || '',
                    'Email': c.email || '',
                    'Telefone': c.phone || '',
                    'Diaria': c.dailyRate || '',
                    'Status': c.status || '',
                    'Contato': c.contact || ''
                }));
                const ws2 = XLSX.utils.json_to_sheet(crewData);
                XLSX.utils.book_append_sheet(wb, ws2, "Equipe");
            }

            // Equipment Sheet
            if (appState.equipment.length > 0) {
                const equipmentData = appState.equipment.map(e => ({
                    'Nome': e.name || '',
                    'Categoria': e.category || '',
                    'Marca': e.brand || '',
                    'Modelo': e.model || '',
                    'Numero Serie': e.serialNumber || '',
                    'Status': e.status || '',
                    'Diaria': e.dailyRate || '',
                    'Localizacao': e.location || ''
                }));
                const ws3 = XLSX.utils.json_to_sheet(equipmentData);
                XLSX.utils.book_append_sheet(wb, ws3, "Equipamentos");
            }

            // Locations Sheet
            if (appState.locations.length > 0) {
                const locationsData = appState.locations.map(l => ({
                    'Nome': l.name || '',
                    'Endereco': l.address || '',
                    'Tipo': l.type || '',
                    'Contato': l.contact || '',
                    'Telefone': l.phone || '',
                    'Taxa': l.fee || '',
                    'Observacoes': l.notes || ''
                }));
                const ws4 = XLSX.utils.json_to_sheet(locationsData);
                XLSX.utils.book_append_sheet(wb, ws4, "Locacoes");
            }

            // Scripts Sheet
            if (appState.scripts.length > 0) {
                const scriptsData = appState.scripts.map(s => ({
                    'Titulo': s.title || '',
                    'Autor': s.author || '',
                    'Versao': s.version || '',
                    'Data': s.date || '',
                    'Formato': s.format || '',
                    'Status': s.status || '',
                    'Paginas': s.pages || '',
                    'Sinopse': s.synopsis || ''
                }));
                const ws5 = XLSX.utils.json_to_sheet(scriptsData);
                XLSX.utils.book_append_sheet(wb, ws5, "Roteiros");
            }

            // Budget Sheet
            if (appState.budget.length > 0) {
                const budgetData = appState.budget.map(b => {
                    const total = (parseFloat(b.quantity) || 0) * (parseFloat(b.unitPrice) || 0);
                    return {
                        'Categoria': b.category || '',
                        'Item': b.item || '',
                        'Descricao': b.description || '',
                        'Quantidade': b.quantity || '',
                        'Valor Unitario': b.unitPrice || '',
                        'Total': total,
                        'Projeto': b.project || ''
                    };
                });
                const ws6 = XLSX.utils.json_to_sheet(budgetData);
                XLSX.utils.book_append_sheet(wb, ws6, "Orcamento");
            }

            // Call Sheets Sheet
            if (appState.callSheets.length > 0) {
                const callSheetsData = appState.callSheets.map(cs => ({
                    'Projeto': cs.project || '',
                    'Data': cs.date || '',
                    'Call Time': cs.callTime || '',
                    'Wrap Time': cs.wrapTime || '',
                    'Clima': cs.weather || '',
                    'Locacao': cs.location || '',
                    'Cenas': cs.scenes || '',
                    'Notas': cs.notes || ''
                }));
                const ws7 = XLSX.utils.json_to_sheet(callSheetsData);
                XLSX.utils.book_append_sheet(wb, ws7, "Call Sheets");
            }

            // Schedule Sheet
            if (appState.schedule.length > 0) {
                const scheduleData = appState.schedule.map(s => ({
                    'Titulo': s.title || '',
                    'Data': s.date || '',
                    'Hora': s.time || '',
                    'Tipo': s.type || '',
                    'Projeto': s.project || '',
                    'Descricao': s.description || ''
                }));
                const ws8 = XLSX.utils.json_to_sheet(scheduleData);
                XLSX.utils.book_append_sheet(wb, ws8, "Cronograma");
            }

            // Documents Sheet
            if (appState.documents.length > 0) {
                const documentsData = appState.documents.map(d => ({
                    'Nome': d.name || '',
                    'Tipo': d.type || '',
                    'Tamanho': d.size || '',
                    'Data Upload': formatDate(d.uploadedAt) || ''
                }));
                const ws9 = XLSX.utils.json_to_sheet(documentsData);
                XLSX.utils.book_append_sheet(wb, ws9, "Documentos");
            }

            // Download file
            const fileName = `CineProd_Completo_${new Date().toISOString().split('T')[0]}.xlsx`;
            XLSX.writeFile(wb, fileName);
            showNotification('Relatorio Excel exportado com sucesso!', 'success');
        }

        function exportCompletePDF() {
            if (typeof jspdf === 'undefined') {
                showNotification('Biblioteca jsPDF nao carregada', 'error');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // ==================== COVER PAGE ====================
            doc.setFontSize(24);
            doc.setFont(undefined, 'bold');
            doc.text('RELATORIO CINEPROD', 105, 40, { align: 'center' });

            doc.setFontSize(14);
            doc.setFont(undefined, 'normal');
            doc.text('Sistema de Gestao Cinematografica', 105, 55, { align: 'center' });
            doc.text('Versao 1.0 - Digimon Style', 105, 65, { align: 'center' });

            doc.setFontSize(12);
            doc.text(`Data: ${new Date().toLocaleDateString('pt-BR')}`, 105, 80, { align: 'center' });

            // ==================== SUMMARY PAGE ====================
            doc.addPage();
            doc.setFontSize(18);
            doc.setFont(undefined, 'bold');
            doc.text('RESUMO EXECUTIVO', 20, 20);

            doc.setFontSize(11);
            doc.setFont(undefined, 'normal');
            let yPos = 35;

            const totalBudget = appState.budget.reduce((sum, item) => {
                const total = (parseFloat(item.quantity) || 0) * (parseFloat(item.unitPrice) || 0);
                return sum + total;
            }, 0);

            const activeProjects = appState.projects.filter(p => p.status === 'Em Producao').length;
            const activeCrew = appState.crew.filter(c => c.status === 'Ativo').length;

            doc.text(`Total de Projetos: ${appState.projects.length}`, 30, yPos);
            yPos += 8;
            doc.text(`Projetos em Producao: ${activeProjects}`, 30, yPos);
            yPos += 8;
            doc.text(`Equipe Total: ${appState.crew.length} membros`, 30, yPos);
            yPos += 8;
            doc.text(`Membros Ativos: ${activeCrew}`, 30, yPos);
            yPos += 8;
            doc.text(`Equipamentos: ${appState.equipment.length} itens`, 30, yPos);
            yPos += 8;
            doc.text(`Locacoes: ${appState.locations.length} locais`, 30, yPos);
            yPos += 8;
            doc.text(`Roteiros: ${appState.scripts.length}`, 30, yPos);
            yPos += 8;
            doc.text(`Call Sheets: ${appState.callSheets.length}`, 30, yPos);
            yPos += 8;
            doc.text(`Eventos Agendados: ${appState.schedule.length}`, 30, yPos);
            yPos += 8;
            doc.text(`Documentos: ${appState.documents.length}`, 30, yPos);
            yPos += 12;
            doc.setFont(undefined, 'bold');
            doc.text(`Orcamento Total: ${formatCurrency(totalBudget)}`, 30, yPos);

            // ==================== PROJECTS TABLE ====================
            if (appState.projects.length > 0) {
                doc.addPage();
                doc.setFontSize(16);
                doc.setFont(undefined, 'bold');
                doc.text('PROJETOS', 20, 20);

                const projectsData = appState.projects.map(p => [
                    p.name || '',
                    p.type || '',
                    p.status || '',
                    p.director || '',
                    formatDate(p.startDate) || ''
                ]);

                doc.autoTable({
                    startY: 30,
                    head: [['Nome', 'Tipo', 'Status', 'Diretor', 'Inicio']],
                    body: projectsData,
                    styles: { fontSize: 9 },
                    headStyles: { fillColor: [74, 159, 255] }
                });
            }

            // ==================== CREW TABLE ====================
            if (appState.crew.length > 0) {
                doc.addPage();
                doc.setFontSize(16);
                doc.setFont(undefined, 'bold');
                doc.text('EQUIPE', 20, 20);

                const crewData = appState.crew.map(c => [
                    c.name || '',
                    c.role || '',
                    c.department || '',
                    formatCurrency(c.dailyRate) || '',
                    c.status || ''
                ]);

                doc.autoTable({
                    startY: 30,
                    head: [['Nome', 'Funcao', 'Departamento', 'Diaria', 'Status']],
                    body: crewData,
                    styles: { fontSize: 9 },
                    headStyles: { fillColor: [74, 159, 255] }
                });
            }

            // ==================== EQUIPMENT TABLE ====================
            if (appState.equipment.length > 0) {
                doc.addPage();
                doc.setFontSize(16);
                doc.setFont(undefined, 'bold');
                doc.text('EQUIPAMENTOS', 20, 20);

                const equipmentData = appState.equipment.map(e => [
                    e.name || '',
                    e.category || '',
                    e.brand || '',
                    e.model || '',
                    e.status || ''
                ]);

                doc.autoTable({
                    startY: 30,
                    head: [['Nome', 'Categoria', 'Marca', 'Modelo', 'Status']],
                    body: equipmentData,
                    styles: { fontSize: 9 },
                    headStyles: { fillColor: [74, 159, 255] }
                });
            }

            // ==================== BUDGET TABLE ====================
            if (appState.budget.length > 0) {
                doc.addPage();
                doc.setFontSize(16);
                doc.setFont(undefined, 'bold');
                doc.text('ORCAMENTO', 20, 20);

                const budgetData = appState.budget.map(b => {
                    const total = (parseFloat(b.quantity) || 0) * (parseFloat(b.unitPrice) || 0);
                    return [
                        b.category || '',
                        b.item || '',
                        b.quantity || '',
                        formatCurrency(b.unitPrice) || '',
                        formatCurrency(total) || ''
                    ];
                });

                doc.autoTable({
                    startY: 30,
                    head: [['Categoria', 'Item', 'Qtd', 'Valor Unit.', 'Total']],
                    body: budgetData,
                    styles: { fontSize: 9 },
                    headStyles: { fillColor: [74, 159, 255] }
                });
            }

            // Save PDF
            const fileName = `Relatorio_CineProd_${new Date().toISOString().split('T')[0]}.pdf`;
            doc.save(fileName);
            showNotification('Relatorio PDF exportado com sucesso!', 'success');
        }
    </script>
</body>
