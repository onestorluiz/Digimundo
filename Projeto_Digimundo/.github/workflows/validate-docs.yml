# 🤖 Documentation Validation Workflow
#
# Nível: ALÉM DO VALE DO SILÍCIO
#
# Este workflow:
# 1. Executa validação em TODOS os PRs
# 2. Bloqueia merge se métricas desatualizadas
# 3. Cria PR automático com correções (opcional)
# 4. Gera relatório de validação como artefato
# 5. Notifica sobre drift detection

name: 🤖 Validate Documentation

on:
  pull_request:
    paths:
      - 'scripts/phase5/ai_*.py'
      - 'docs/fase_5/**/*.md'
      - '.github/workflows/validate-docs.yml'
  push:
    branches:
      - main
      - debugging-systematic
    paths:
      - 'scripts/phase5/ai_*.py'
      - 'docs/fase_5/**/*.md'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      auto_update:
        description: 'Auto-update metrics if drift detected'
        required: false
        type: boolean
        default: false

jobs:
  validate:
    name: Validate Metrics & Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Add any dependencies needed by AI scripts
          # pip install -r requirements-dev.txt

      - name: 🤖 Run Documentation Validation
        id: validate
        run: |
          echo "::group::Running validation"

          AUTO_UPDATE_FLAG=""
          if [ "${{ github.event.inputs.auto_update }}" = "true" ]; then
            AUTO_UPDATE_FLAG="--auto-update"
          fi

          python3 scripts/phase5/validate_documentation.py $AUTO_UPDATE_FLAG

          EXIT_CODE=$?
          echo "::endgroup::"

          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Validation failed!"
            exit 1
          fi

          echo "✅ Validation passed!"

      - name: 📊 Upload Validation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ github.run_number }}
          path: docs/fase_5/VALIDATION_REPORT_*.md
          retention-days: 30

      - name: 📝 Comment on PR (if validation failed)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Find latest validation report
            const reports = fs.readdirSync('docs/fase_5')
              .filter(f => f.startsWith('VALIDATION_REPORT_'))
              .sort()
              .reverse();

            let reportContent = '# ⚠️ Documentation Validation Failed\n\n';

            if (reports.length > 0) {
              const report = fs.readFileSync(`docs/fase_5/${reports[0]}`, 'utf8');
              reportContent += report;
            } else {
              reportContent += 'No validation report generated. Check workflow logs.';
            }

            reportContent += '\n\n---\n\n';
            reportContent += '**Fix the issues above or run:**\n';
            reportContent += '```bash\n';
            reportContent += 'python3 scripts/phase5/validate_documentation.py\n';
            reportContent += '```\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reportContent
            });

      - name: 🔄 Create Auto-Fix PR (if auto-update enabled)
        if: |
          github.event.inputs.auto_update == 'true' &&
          github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            🤖 Auto-update documentation metrics

            Metrics updated by automated validation system:
            - Detected drift > 5%
            - Updated baseline values
            - Generated changelog

            🤖 Generated with Claude Code

            Co-Authored-By: Claude <noreply@anthropic.com>
          branch: auto-update-metrics-${{ github.run_number }}
          title: '🤖 Auto-update documentation metrics'
          body: |
            ## 🤖 Automated Metrics Update

            This PR was automatically generated by the documentation validation system.

            ### Changes
            - ✅ Updated metrics to match current codebase state
            - ✅ Regenerated validation report
            - ✅ Updated METRICS_UPDATE_LOG.md

            ### Validation Report
            See attached validation report artifact for details.

            ### Review Checklist
            - [ ] Verify metrics changes are reasonable
            - [ ] Check METRICS_UPDATE_LOG.md for drift details
            - [ ] Ensure no unexpected documentation changes

            ---
            🤖 Generated with [Claude Code](https://claude.com/claude-code)
          labels: |
            documentation
            automated
            metrics

      - name: ✅ Validation Success
        if: success()
        run: |
          echo "::notice::🎉 Documentation validation passed!"
          echo "All metrics are consistent and up-to-date."
