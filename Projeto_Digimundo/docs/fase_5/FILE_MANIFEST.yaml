# ============================================================================
# DEPENDENCIES GRAPH
# ============================================================================

dependency_graph:
  # Event Sourcing depends on nothing (foundational)
  event_sourcing:
    - app/models/event.py
    - app/services/event_store_service.py

  # Conflict Detection depends on Event Sourcing
  conflict_detection:
    depends_on:
      - app/services/event_store_service.py
    files:
      - app/services/conflict_detection_service.py
      - app/models/conflict.py

  # Schedule Optimizer depends on Conflict Detection (for constraints)
  schedule_optimizer:
    depends_on:
      - app/services/conflict_detection_service.py
    files:
      - app/services/schedule_optimizer_service.py
      - app/ml/optimization/cp_solver.py

  # Predictive Analytics independent (can run in parallel)
  predictive_analytics:
    depends_on: []
    files:
      - app/ml/models/budget_predictor.py
      - app/ml/serving/predictor.py
      - app/services/ml_service.py
